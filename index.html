          result = aValid ? aValue - bValue : 0;
        } else if (field === 'size') {
          result = (Number(a.size) || 0) - (Number(b.size) || 0);
        } else if (field === 'addedAt') {
          result = (Number(a.addedAt) || 0) - (Number(b.addedAt) || 0);
        }

        return descending ? -result : result;
      }

      function applyCustomSort() {
        if (!state.tracks.length || state.reorderMode || state.playlistDragActive) return false;
        const primaryField = ui.customSortPrimaryField.value || 'name';
        const primaryDirection = ui.customSortPrimaryDirection.value === 'desc' ? 'desc' : 'asc';
        const secondaryField = ui.customSortSecondaryField.value;
        const secondaryDirection = ui.customSortSecondaryDirection.value === 'desc' ? 'desc' : 'asc';
        const rules = [{ field: primaryField, direction: primaryDirection }];
        if (secondaryField && secondaryField !== primaryField) {
          rules.push({ field: secondaryField, direction: secondaryDirection });
        }

        const beforeIds = state.tracks.map(track => track.id);
        const originalPosition = new Map(beforeIds.map((id, index) => [id, index]));
        const nextIds = state.tracks
          .slice()
          .sort((a, b) => {
            for (const rule of rules) {
              const compared = compareCustomSortField(a, b, rule.field, rule.direction);
              if (compared) return compared;
            }
            // 稳定兜底：全部规则相同时，严格保持应用前的相对位置。
            return originalPosition.get(a.id) - originalPosition.get(b.id);
          })
          .map(track => track.id);

        if (beforeIds.every((id, index) => id === nextIds[index])) return false;
        state.customSortUndoIds = beforeIds;
        return applyExactTrackOrder(nextIds, { preserveCustomSortUndo: true });
      }

      function undoCustomSort() {
        const undoIds = state.customSortUndoIds.slice();
        state.customSortUndoIds = [];
        const changed = applyExactTrackOrder(undoIds, { preserveCustomSortUndo: true });
        if (!changed) renderPlaylist();
        return changed;
      }

      function setReorderMode(enabled) {
        if (state.playlistDragActive) return;
        if (enabled) closeMenus();
        state.reorderMode = Boolean(enabled && state.tracks.length);
        renderPlaylist();
      }

      function nextIndexForMode() {
        if (!state.tracks.length) return -1;
        const mode = MODES[state.modeIndex].key;
        if (mode === 'repeat-one') return state.currentIndex;
        if (mode === 'shuffle') {
          if (state.tracks.length === 1) return 0;
          let candidate = state.currentIndex;
          while (candidate === state.currentIndex) {
            candidate = Math.floor(Math.random() * state.tracks.length);
          }
          return candidate;
        }
        return state.currentIndex + 1 < state.tracks.length ? state.currentIndex + 1 : 0;
      }

      function previousTrack() {
        if (!state.tracks.length) return;
        const index = state.currentIndex > 0 ? state.currentIndex - 1 : state.tracks.length - 1;
        loadTrack(index, true);
      }

      function nextTrack() {
        if (!state.tracks.length) return;
        const index = state.currentIndex + 1 < state.tracks.length ? state.currentIndex + 1 : 0;
        loadTrack(index, true);
      }

      function handleEnded() {
        const next = nextIndexForMode();
        if (next >= 0) {
          loadTrack(next, true);
        } else {
          state.playIntent = false;
          ui.audio.currentTime = 0;
          updateProgress();
          updatePlayButton();
        }
      }

      function probeDuration(track) {
        const probe = document.createElement('audio');
        probe.preload = 'metadata';
        probe.muted = true;
        const finish = () => {
          probe.removeAttribute('src');
          probe.load();
        };
        probe.addEventListener('loadedmetadata', () => {
          if (Number.isFinite(probe.duration) && probe.duration > 0) {
            track.duration = probe.duration;
            if (activeTrack() === track) ui.duration.textContent = formatTime(track.duration);
            renderPlaylist();
            void persistTrack(track);
          }
          finish();
        }, { once: true });
        probe.addEventListener('error', finish, { once: true });
        probe.src = track.url;
      }

      async function addFiles(fileList) {
        const files = Array.from(fileList || []);
        const accepted = files.filter(isLikelyAudio);
        const rejected = files.length - accepted.length;
        const lastOrder = state.tracks.reduce((max, track) => Math.max(max, Number(track.order) || 0), 0);
        const orderBase = lastOrder + 1000;
        const addedTracks = [];

        accepted.forEach((file, offset) => {
          const fileName = file.name || '未命名音频';
          const mimeCandidates = audioMimeCandidates(fileName, file.type || '');
          const blob = normalizeAudioBlob(file, fileName, mimeCandidates[0] || '');
          const track = {
            id: globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`,
            file: blob,
            blob,
            fileName,
            url: URL.createObjectURL(blob),
            name: cleanName(fileName),
            type: blob.type || file.type || '',
            mimeCandidates,
            mimeIndex: 0,
            lastModified: Number(file.lastModified) || 0,
            size: blob.size || file.size || 0,
            duration: 0,
            addedAt: Date.now(),
            order: orderBase + offset * 1000
          };
          state.tracks.push(track);
          addedTracks.push(track);
          probeDuration(track);
        });

        renderPlaylist();
        if (state.currentIndex < 0 && state.tracks.length) loadTrack(0, false);
        await Promise.all(addedTracks.map(persistTrack));
        if (rejected > 0) alert(`已跳过 ${rejected} 个无法识别为音频的文件。`);
      }

      function queueFileImport(fileList) {
        const files = Array.from(fileList || []);
        if (!files.length) return importQueue;
        if (state.reorderMode || state.playlistDragActive) {
          alert('请先点击“完成排序”，再导入新的音频文件。');
          return importQueue;
        }
        importQueue = importQueue.then(async () => {
          await ensurePersistentStorage();
          await addFiles(files);
        }).catch(error => {
          console.error('导入音频失败', error);
          alert(`导入音频失败：${error?.message || '未知错误'}`);
        });
        return importQueue;
      }

      function dragEventContainsFiles(event) {
        const transfer = event.dataTransfer;
        if (!transfer) return false;
        const types = Array.from(transfer.types || []);
        if (types.includes('Files')) return true;
        return Array.from(transfer.items || []).some(item => item.kind === 'file');
      }

      async function clearAllTracks() {
        if (!state.tracks.length || state.reorderMode || state.playlistDragActive) return;
        const count = state.tracks.length;
        const confirmed = confirm(`确定清空播放列表并永久删除已保存的 ${count} 个音频吗？此操作无法撤销。`);
        if (!confirmed) return;

        try {
          await audioStore.clear();
        } catch (error) {
          notifyPersistenceIssue(error, '清空');
          return;
        }

        ui.audio.pause();
        state.tracks.forEach(track => URL.revokeObjectURL(track.url));
        state.tracks.length = 0;
        ui.fileInput.value = '';
        resetPlayerView();
      }

      function removeTrack(index) {
        if (state.reorderMode || state.playlistDragActive) return;
        if (!Number.isInteger(index) || index < 0 || index >= state.tracks.length) return;
        const deletingCurrent = index === state.currentIndex;
        const wasPlaying = !ui.audio.paused && !ui.audio.ended;
        const [removed] = state.tracks.splice(index, 1);

        if (deletingCurrent) {
          ui.audio.pause();
          ui.audio.removeAttribute('src');
          ui.audio.load();
        }
        URL.revokeObjectURL(removed.url);
        audioStore.delete(removed.id).catch(error => notifyPersistenceIssue(error, '删除'));

        if (!state.tracks.length) {
          resetPlayerView();
          return;
        }

        if (deletingCurrent) {
          loadTrack(Math.min(index, state.tracks.length - 1), wasPlaying);
        } else {
          if (index < state.currentIndex) state.currentIndex -= 1;
          renderPlaylist();
        }
      }

      function setRate(value, persist = true) {
        state.rate = clamp(Number(value) || 1, 0.5, 2);
        ui.audio.playbackRate = state.rate;
        ui.audio.defaultPlaybackRate = state.rate;
        ui.speedRange.value = String(state.rate);
        ui.speedValue.textContent = `${state.rate.toFixed(2)}×`;
        document.querySelectorAll('[data-speed]').forEach(button => {
          button.classList.toggle('active', Math.abs(Number(button.dataset.speed) - state.rate) < 0.001);
        });
        if (persist) storage.set('english-focus-player-speed', state.rate);
      }

      function setOpacity(value, persist = true) {
        const opacity = Math.round(clamp(Number(value) || 0, 0, 100));
        document.documentElement.style.setProperty('--player-alpha', String(opacity / 100));
        ui.opacityRange.value = String(opacity);
        ui.opacityValue.textContent = `${opacity}%`;
        ui.opacityRangeValue.textContent = String(opacity);
        if (state.floatingWindow && !state.floatingWindow.closed) {
          state.floatingWindow.document.documentElement.style.setProperty('--player-alpha', String(opacity / 100));
        }
        if (persist) storage.set('english-focus-player-opacity', opacity);
      }

      function applyTheme(theme, persist = true) {
        const safeTheme = Object.prototype.hasOwnProperty.call(THEMES, theme) ? theme : 'pearl';
        document.documentElement.dataset.theme = safeTheme;
        ui.themeCurrentName.textContent = THEMES[safeTheme];
        document.querySelectorAll('[data-theme-option]').forEach(button => {
          button.classList.toggle('active', button.dataset.themeOption === safeTheme);
        });
        requestAnimationFrame(() => {
          const color = getComputedStyle(document.documentElement).getPropertyValue('--theme-color').trim() || '#f1f2ff';
          ui.themeColorMeta.content = color;
        });
        if (state.floatingWindow && !state.floatingWindow.closed) {
          state.floatingWindow.document.documentElement.dataset.theme = safeTheme;
        }
        if (persist) storage.set('english-focus-player-theme', safeTheme);
      }

      function syncCustomSortLayer() {
        const open = !ui.customSortMenu.hidden;
        ui.customSortBackdrop.hidden = !open;
        document.body.classList.toggle('custom-sort-open', open);
      }

      function closeMenus(except = null) {
        [[ui.speedMenu, ui.speedButton], [ui.opacityMenu, ui.opacityButton], [ui.customSortMenu, ui.customSortButton]].forEach(([menu, button]) => {
          if (menu !== except) {
            menu.hidden = true;
            button.setAttribute('aria-expanded', 'false');
          }
        });
        syncCustomSortLayer();
      }

      function toggleMenu(menu, button) {
        const opening = menu.hidden;
        closeMenus(opening ? menu : null);
        menu.hidden = !opening;
        button.setAttribute('aria-expanded', String(opening));
        syncCustomSortLayer();
        if (opening && menu === ui.customSortMenu) {
          requestAnimationFrame(() => ui.customSortPrimaryField.focus({ preventScroll: true }));
        }
      }

      function makePlaceholder() {
        if (!state.placeholder) {
          state.placeholder = document.createElement('div');
          state.placeholder.className = 'floating-placeholder';
          state.placeholder.textContent = '播放器已进入悬浮窗';
        }
        return state.placeholder;
      }

      function restorePlayerToPage() {
        try {
          if (ui.playerCard.ownerDocument !== document) document.adoptNode(ui.playerCard);
          ui.playerSlot.replaceChildren(ui.playerCard);
        } catch (_) {
          ui.playerSlot.replaceChildren(ui.playerCard);
        }
        state.placeholder?.remove();
        state.floatingWindow = null;
        state.fallbackFloating = false;
        ui.playerCard.classList.remove('fallback-floating');
        ui.floatingLabel.textContent = '一键悬浮窗';
      }

      function bindOutsideClick(doc) {
        if (doc.documentElement.dataset.playerOutsideClickBound === '1') return;
        doc.documentElement.dataset.playerOutsideClickBound = '1';
        doc.addEventListener('click', () => closeMenus());
        doc.addEventListener('keydown', event => {
          if (event.key === 'Escape' && !ui.customSortMenu.hidden) {
            event.preventDefault();
            closeMenus();
            if (doc === document) ui.customSortButton.focus({ preventScroll: true });
          }
        });
      }

      async function toggleFloating() {
        closeMenus();

        if (state.floatingWindow && !state.floatingWindow.closed) {
          state.floatingWindow.close();
          return;
        }

        if (state.fallbackFloating) {
          state.fallbackFloating = false;
          ui.playerCard.classList.remove('fallback-floating');
          ui.floatingLabel.textContent = '一键悬浮窗';
          return;
        }

        if ('documentPictureInPicture' in window) {
          try {
            const pipWindow = await window.documentPictureInPicture.requestWindow({ width: 1080, height: 330 });
            state.floatingWindow = pipWindow;
            const styleText = Array.from(document.querySelectorAll('style')).map(style => style.textContent).join('\n');
            pipWindow.document.head.innerHTML = `<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>英语听力播放器</title><style>${styleText}</style>`;
            pipWindow.document.documentElement.dataset.theme = document.documentElement.dataset.theme;
            pipWindow.document.documentElement.style.setProperty('--player-alpha', getComputedStyle(document.documentElement).getPropertyValue('--player-alpha'));
            pipWindow.document.body.className = 'pip-mode';
            ui.playerSlot.replaceChildren(makePlaceholder());
            pipWindow.document.body.appendChild(ui.playerCard);
            ui.floatingLabel.textContent = '退出悬浮窗';
            bindOutsideClick(pipWindow.document);
            pipWindow.addEventListener('pagehide', restorePlayerToPage, { once: true });
            return;
          } catch (error) {
            console.warn('系统悬浮窗不可用，已使用页面内悬浮模式。', error);
          }
        }

        state.fallbackFloating = true;
        ui.playerCard.classList.add('fallback-floating');
        ui.floatingLabel.textContent = '退出悬浮窗';
      }

      function installMediaSessionActions() {
        if (!('mediaSession' in navigator)) return;
        const handlers = {
          play: startPlayback,
          pause: () => ui.audio.pause(),
          seekbackward: details => seekBy(-(details.seekOffset || 10)),
          seekforward: details => seekBy(details.seekOffset || 10),
          previoustrack: previousTrack,
          nexttrack: nextTrack,
          seekto: details => {
            if (details.fastSeek && typeof ui.audio.fastSeek === 'function') ui.audio.fastSeek(details.seekTime);
            else seekTo(details.seekTime);
          }
        };
        Object.entries(handlers).forEach(([action, handler]) => {
          try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) {}
        });
      }


      /*
       * 播放列表与页面的无缝滚动链：
       * - 手指上滑：列表先向下滚；到达底部后，同一次手势的剩余距离立刻滚动页面。
       * - 手指下滑：列表先向上滚；到达顶部后，同一次手势的剩余距离立刻滚动页面。
       * - 支持触摸惯性和鼠标滚轮/触控板跨边界传递，避免边界处出现一次“卡住”。
       */
      function installPlaylistScrollBridge() {
        const list = ui.audioList;
        const pageScroller = () => document.scrollingElement || document.documentElement;
        const EPSILON = 0.5;
        let touchState = null;
        let momentumFrame = 0;

        const cancelMomentum = () => {
          if (momentumFrame) cancelAnimationFrame(momentumFrame);
          momentumFrame = 0;
        };

        const isScrollableList = () => {
          const style = getComputedStyle(list);
          return style.overflowY !== 'visible' && list.scrollHeight > list.clientHeight + 1;
        };

        const distributeScroll = delta => {
          if (!Number.isFinite(delta) || Math.abs(delta) < EPSILON) return 0;

          let remaining = delta;
          let consumed = 0;
          const listMax = Math.max(0, list.scrollHeight - list.clientHeight);
          const listBefore = list.scrollTop;
          const listTarget = clamp(listBefore + remaining, 0, listMax);
          list.scrollTop = listTarget;
          const listUsed = list.scrollTop - listBefore;
          consumed += listUsed;
          remaining -= listUsed;

          if (Math.abs(remaining) >= EPSILON) {
            const page = pageScroller();
            const pageMax = Math.max(0, page.scrollHeight - page.clientHeight);
            const pageBefore = page.scrollTop;
            const pageTarget = clamp(pageBefore + remaining, 0, pageMax);
            page.scrollTop = pageTarget;
            const pageUsed = page.scrollTop - pageBefore;
            consumed += pageUsed;
            remaining -= pageUsed;
          }

          return consumed;
        };

        const startMomentum = initialVelocity => {
          cancelMomentum();
          if (!Number.isFinite(initialVelocity) || Math.abs(initialVelocity) < 0.06) return;
          let velocity = clamp(initialVelocity, -2.8, 2.8);
          let previousTime = performance.now();

          const step = now => {
            const elapsed = Math.min(32, Math.max(1, now - previousTime));
            previousTime = now;
            const requested = velocity * elapsed;
            const consumed = distributeScroll(requested);

            velocity *= Math.pow(0.94, elapsed / 16.667);
            if (Math.abs(consumed) < EPSILON || Math.abs(velocity) < 0.025) {
              momentumFrame = 0;
              return;
            }
            momentumFrame = requestAnimationFrame(step);
          };

          momentumFrame = requestAnimationFrame(step);
        };

        list.addEventListener('touchstart', event => {
          if (event.touches.length !== 1 || state.playlistDragActive) return;
          if (event.target.closest('.drag-handle:not(:disabled)')) return;
          cancelMomentum();
          const touch = event.touches[0];
          touchState = {
            lastX: touch.clientX,
            lastY: touch.clientY,
            lastTime: performance.now(),
            totalX: 0,
            totalY: 0,
            velocity: 0,
            axis: '',
            moved: false
          };
        }, { passive: true });

        list.addEventListener('touchmove', event => {
          if (!touchState || event.touches.length !== 1 || state.playlistDragActive) return;
          const touch = event.touches[0];
          const now = performance.now();
          const fingerDX = touch.clientX - touchState.lastX;
          const fingerDY = touch.clientY - touchState.lastY;
          touchState.totalX += fingerDX;
          touchState.totalY += fingerDY;

          if (!touchState.axis) {
            const absX = Math.abs(touchState.totalX);
            const absY = Math.abs(touchState.totalY);
            if (Math.max(absX, absY) < 5) return;
            touchState.axis = absY >= absX * 0.85 ? 'y' : 'x';
          }
          if (touchState.axis !== 'y') return;

          event.preventDefault();
          const scrollDelta = -fingerDY;
          const elapsed = Math.max(1, now - touchState.lastTime);
          const instantVelocity = scrollDelta / elapsed;
          touchState.velocity = touchState.velocity * 0.72 + instantVelocity * 0.28;
          touchState.moved = touchState.moved || Math.abs(touchState.totalY) > 7;
          distributeScroll(scrollDelta);

          touchState.lastX = touch.clientX;
          touchState.lastY = touch.clientY;
          touchState.lastTime = now;
        }, { passive: false });

        const finishTouch = () => {
          if (!touchState) return;
          const velocity = touchState.axis === 'y' && touchState.moved ? touchState.velocity : 0;
          touchState = null;
          startMomentum(velocity);
        };
        list.addEventListener('touchend', finishTouch, { passive: true });
        list.addEventListener('touchcancel', () => {
          touchState = null;
          cancelMomentum();
        }, { passive: true });

        list.addEventListener('wheel', event => {
          if (event.ctrlKey || event.shiftKey || !isScrollableList()) return;
          const delta = event.deltaMode === 1
            ? event.deltaY * 16
            : event.deltaMode === 2
              ? event.deltaY * list.clientHeight
              : event.deltaY;
          if (!Number.isFinite(delta) || Math.abs(delta) < EPSILON) return;

          const listMax = Math.max(0, list.scrollHeight - list.clientHeight);
          const willCrossTop = delta < 0 && list.scrollTop + delta < 0;
          const willCrossBottom = delta > 0 && list.scrollTop + delta > listMax;
          const alreadyAtTop = delta < 0 && list.scrollTop <= EPSILON;
          const alreadyAtBottom = delta > 0 && list.scrollTop >= listMax - EPSILON;
          if (!(willCrossTop || willCrossBottom || alreadyAtTop || alreadyAtBottom)) return;

          event.preventDefault();
          distributeScroll(delta);
        }, { passive: false });
      }

      function bindEvents() {
        installPlaylistScrollBridge();
        ui.fileInput.addEventListener('change', event => {
          const input = event.currentTarget;
          // FileList 是动态对象；必须先复制，再清空 input，否则所选文件会立即变成空列表。
          const files = Array.from(input.files || []);
          input.value = '';
          void queueFileImport(files);
        });

        // 电脑端可把音频拖到页面任意位置；不增加任何提示文字或固定投放区域。
        const preventFileNavigation = event => {
          if (!dragEventContainsFiles(event)) return;
          event.preventDefault();
          event.stopPropagation();
          if (event.type === 'dragover' && event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
        };
        window.addEventListener('dragenter', preventFileNavigation, true);
        window.addEventListener('dragover', preventFileNavigation, true);
        window.addEventListener('drop', event => {
          const files = Array.from(event.dataTransfer?.files || []);
          if (!files.length && !dragEventContainsFiles(event)) return;
          event.preventDefault();
          event.stopPropagation();
          if (state.reorderMode || state.playlistDragActive) {
            alert('请先点击“完成排序”，再导入新的音频文件。');
            return;
          }
          void queueFileImport(files);
        }, true);

        ui.clearButton.addEventListener('click', clearAllTracks);

        ui.audioList.addEventListener('click', event => {
          if (state.reorderMode || event.target.closest('[data-drag-id]')) return;
          const deleteButton = event.target.closest('[data-delete-index]');
          if (deleteButton) {
            event.stopPropagation();
            removeTrack(Number(deleteButton.dataset.deleteIndex));
            return;
          }
          const item = event.target.closest('[data-index]');
          if (item) loadTrack(Number(item.dataset.index), true);
        });

        ui.audioList.addEventListener('keydown', event => {
          const handle = event.target.closest('[data-drag-id]');
          const item = event.target.closest('[data-index]');
          if (!item) return;
          if (state.reorderMode && handle && (event.key === 'ArrowUp' || event.key === 'ArrowDown')) {
            event.preventDefault();
            const sourceId = item.dataset.trackId || '';
            const index = state.tracks.findIndex(track => track.id === sourceId);
            const targetIndex = clamp(index + (event.key === 'ArrowUp' ? -1 : 1), 0, state.tracks.length - 1);
            if (moveTrack(index, targetIndex)) {
              ui.audioList.querySelector(`[data-track-id="${sourceId}"] [data-drag-id]`)?.focus();
            }
            return;
          }
          if (state.reorderMode || handle || (event.key !== 'Enter' && event.key !== ' ')) return;
          event.preventDefault();
          loadTrack(Number(item.dataset.index), true);
        });

        ui.reorderButton.addEventListener('click', () => setReorderMode(!state.reorderMode));
        ui.customSortButton.addEventListener('click', event => {
          event.stopPropagation();
          if (ui.customSortButton.disabled) return;
          toggleMenu(ui.customSortMenu, ui.customSortButton);
        });
        ui.customSortMenu.addEventListener('click', event => event.stopPropagation());
        ui.customSortBackdrop.addEventListener('click', () => closeMenus());
        ui.customSortCloseButton.addEventListener('click', () => closeMenus());
        ui.customSortSecondaryField.addEventListener('change', () => {
          ui.customSortSecondaryDirection.disabled = !ui.customSortSecondaryField.value;
        });
        ui.customSortCancelButton.addEventListener('click', () => closeMenus());
        ui.customSortApplyButton.addEventListener('click', () => {
          applyCustomSort();
          closeMenus();
        });
        ui.customSortUndoButton.addEventListener('click', () => {
          undoCustomSort();
          closeMenus();
        });
        ui.previousButton.addEventListener('click', previousTrack);
        ui.nextButton.addEventListener('click', nextTrack);

        let dragPointerId = null;
        let dragSourceId = '';
        let dragGapIndex = null;
        let dragBaseOrderIds = [];
        let dragStartX = 0;
        let dragStartY = 0;
        let dragLastY = 0;
        let dragStarted = false;
        let dragHandleElement = null;
        let dragAutoScrollFrame = 0;

        const ensureDropIndicator = () => {
          let indicator = ui.audioList.querySelector('.playlist-drop-indicator');
          if (!indicator) {
            indicator = document.createElement('div');
            indicator.className = 'playlist-drop-indicator horizontal';
            indicator.hidden = true;
            ui.audioList.appendChild(indicator);
          }
          return indicator;
        };

        const hideDropIndicator = () => {
          const indicator = ui.audioList.querySelector('.playlist-drop-indicator');
          if (indicator) indicator.hidden = true;
        };

        const clearDragClasses = () => {
          ui.audioList.classList.remove('dragging-tracks');
          ui.audioList.querySelectorAll('.drag-source').forEach(item => item.classList.remove('drag-source'));
          hideDropIndicator();
        };

        // 排序模式强制为单列，因此落点只有明确的“第几个间隙”，不存在双列跨栏歧义。
        const findVerticalGap = clientY => {
          const targets = [...ui.audioList.querySelectorAll('.audio-item[data-track-id]')]
            .filter(item => item.dataset.trackId !== dragSourceId)
            .map(item => ({ item, rect: item.getBoundingClientRect() }));
          const listRect = ui.audioList.getBoundingClientRect();
          const left = listRect.left + 8;
          const right = listRect.right - 12;

          if (!targets.length) {
            return { gapIndex: 0, left, right, top: listRect.top + 8 };
          }
          for (let index = 0; index < targets.length; index += 1) {
            const rect = targets[index].rect;
            if (clientY < rect.top + rect.height / 2) {
              return { gapIndex: index, left, right, top: rect.top - 4 };
            }
          }
          return {
            gapIndex: targets.length,
            left,
            right,
            top: targets[targets.length - 1].rect.bottom + 4
          };
        };

        const showVerticalGap = placement => {
          const indicator = ensureDropIndicator();
          const listRect = ui.audioList.getBoundingClientRect();
          indicator.className = 'playlist-drop-indicator horizontal';
          indicator.hidden = false;
          indicator.style.left = `${placement.left - listRect.left + ui.audioList.scrollLeft}px`;
          indicator.style.top = `${placement.top - listRect.top + ui.audioList.scrollTop - 2}px`;
          indicator.style.width = `${Math.max(72, placement.right - placement.left)}px`;
          indicator.style.height = '4px';
        };

        const updateDragGap = clientY => {
          const placement = findVerticalGap(clientY);
          dragGapIndex = placement.gapIndex;
          showVerticalGap(placement);
        };

        const stopDragAutoScroll = () => {
          if (dragAutoScrollFrame) cancelAnimationFrame(dragAutoScrollFrame);
          dragAutoScrollFrame = 0;
        };

        const runDragAutoScroll = () => {
          stopDragAutoScroll();
          const step = () => {
            if (!dragStarted || dragPointerId === null) {
              dragAutoScrollFrame = 0;
              return;
            }
            const rect = ui.audioList.getBoundingClientRect();
            const edge = Math.min(56, Math.max(34, rect.height * .16));
            let delta = 0;
            if (dragLastY < rect.top + edge) {
              delta = -clamp((rect.top + edge - dragLastY) * .24, 3, 18);
            } else if (dragLastY > rect.bottom - edge) {
              delta = clamp((dragLastY - (rect.bottom - edge)) * .24, 3, 18);
            }
            if (delta) {
              const before = ui.audioList.scrollTop;
              ui.audioList.scrollTop += delta;
              if (ui.audioList.scrollTop !== before) updateDragGap(dragLastY);
            }
            dragAutoScrollFrame = requestAnimationFrame(step);
          };
          dragAutoScrollFrame = requestAnimationFrame(step);
        };

        const resetTrackDrag = changed => {
          stopDragAutoScroll();
          clearDragClasses();
          if (dragHandleElement && dragPointerId !== null) {
            try { dragHandleElement.releasePointerCapture?.(dragPointerId); } catch (_) {}
          }
          dragPointerId = null;
          dragSourceId = '';
          dragGapIndex = null;
          dragBaseOrderIds = [];
          dragStarted = false;
          dragHandleElement = null;
          state.playlistDragActive = false;
          const renderPending = state.playlistRenderPending;
          state.playlistRenderPending = false;
          if (changed) {
            renderPlaylist();
            void persistTrackOrder();
          } else if (renderPending) {
            renderPlaylist();
          }
        };

        ui.audioList.addEventListener('pointerdown', event => {
          const handle = event.target.closest('[data-drag-id]');
          if (!state.reorderMode || !handle || event.button !== 0 || event.isPrimary === false || state.playlistDragActive) return;
          const sourceId = handle.dataset.dragId || '';
          if (!sourceId || !state.tracks.some(track => track.id === sourceId)) return;
          event.preventDefault();
          event.stopPropagation();
          state.playlistDragActive = true;
          state.playlistRenderPending = false;
          dragPointerId = event.pointerId;
          dragSourceId = sourceId;
          dragGapIndex = null;
          dragBaseOrderIds = state.tracks.map(track => track.id);
          dragStartX = event.clientX;
          dragStartY = dragLastY = event.clientY;
          dragStarted = false;
          dragHandleElement = handle;
          handle.setPointerCapture?.(dragPointerId);
          handle.closest('.audio-item')?.classList.add('drag-source');
          handle.setAttribute('aria-grabbed', 'true');
        });

        ui.audioList.addEventListener('pointermove', event => {
          if (dragPointerId === null || event.pointerId !== dragPointerId) return;
          event.preventDefault();
          dragLastY = event.clientY;
          if (!dragStarted && Math.hypot(event.clientX - dragStartX, event.clientY - dragStartY) < 5) return;
          if (!dragStarted) {
            dragStarted = true;
            ui.audioList.classList.add('dragging-tracks');
            runDragAutoScroll();
          }
          updateDragGap(dragLastY);
        });

        const finishTrackDrag = event => {
          if (dragPointerId === null || event.pointerId !== dragPointerId) return;
          const sourceId = dragSourceId;
          const gapIndex = dragGapIndex;
          const baseOrderIds = dragBaseOrderIds.slice();
          const didDrag = dragStarted;
          dragHandleElement?.removeAttribute('aria-grabbed');
          const changed = didDrag && Number.isInteger(gapIndex)
            ? moveTrackToGap(sourceId, gapIndex, baseOrderIds)
            : false;
          resetTrackDrag(changed);
        };

        const cancelTrackDrag = event => {
          if (dragPointerId === null || (event.pointerId !== undefined && event.pointerId !== dragPointerId)) return;
          dragHandleElement?.removeAttribute('aria-grabbed');
          resetTrackDrag(false);
        };

        window.addEventListener('pointerup', finishTrackDrag, true);
        window.addEventListener('pointercancel', cancelTrackDrag, true);
        window.addEventListener('blur', cancelTrackDrag);

        ui.playButton.addEventListener('click', togglePlayback);
        document.querySelectorAll('[data-seek]').forEach(button => {
          button.addEventListener('click', () => seekBy(Number(button.dataset.seek)));
        });


        ui.modeButton.addEventListener('click', () => {
          state.modeIndex = (state.modeIndex + 1) % MODES.length;
          storage.set('english-focus-player-mode', MODES[state.modeIndex].key);
          updateModeButton();
        });

        ui.speedButton.addEventListener('click', event => {
          event.stopPropagation();
          toggleMenu(ui.speedMenu, ui.speedButton);
        });
        ui.opacityButton.addEventListener('click', event => {
          event.stopPropagation();
          toggleMenu(ui.opacityMenu, ui.opacityButton);
        });
        ui.speedMenu.addEventListener('click', event => event.stopPropagation());
        ui.opacityMenu.addEventListener('click', event => event.stopPropagation());
        bindOutsideClick(document);

        ui.speedRange.addEventListener('input', event => setRate(event.target.value));
        ui.speedPresets.addEventListener('click', event => {
          const button = event.target.closest('[data-speed]');
          if (button) setRate(button.dataset.speed);
        });
        ui.opacityRange.addEventListener('input', event => setOpacity(event.target.value));
        ui.floatingButton.addEventListener('click', toggleFloating);

        let pointerId = null;
        ui.progress.addEventListener('pointerdown', event => {
          if (state.currentIndex < 0) return;
          event.preventDefault();
          pointerId = event.pointerId;
          state.seeking = true;
          ui.progress.classList.add('dragging');
          ui.progress.setPointerCapture(pointerId);
          // 拖动过程中只更新位置，释放进度条时再统一确保开始播放。
          seekFromPointer(event.clientX);
        });
        ui.progress.addEventListener('pointermove', event => {
          if (state.seeking && event.pointerId === pointerId) seekFromPointer(event.clientX);
        });
        const finishSeek = event => {
          if (!state.seeking || event.pointerId !== pointerId) return;
          const didSeek = seekFromPointer(event.clientX);
          state.seeking = false;
          ui.progress.classList.remove('dragging');
          pointerId = null;
          // 无论拖动前是暂停还是播放，释放后都应处于正常播放状态。
          if (didSeek && (ui.audio.paused || ui.audio.ended)) {
            startPlayback({ userInitiated: true });
          }
        };
        ui.progress.addEventListener('pointerup', finishSeek);
        ui.progress.addEventListener('pointercancel', () => {
          state.seeking = false;
          ui.progress.classList.remove('dragging');
          pointerId = null;
        });
        ui.progress.addEventListener('keydown', event => {
          if (event.key === 'ArrowLeft') { event.preventDefault(); seekBy(-5); }
          if (event.key === 'ArrowRight') { event.preventDefault(); seekBy(5); }
          if (event.key === 'Home') { event.preventDefault(); seekTo(0); }
          if (event.key === 'End' && Number.isFinite(ui.audio.duration)) { event.preventDefault(); seekTo(ui.audio.duration); }
        });

        ui.audio.addEventListener('loadedmetadata', () => {
          const track = activeTrack();
          const duration = Number(ui.audio.duration);
          if (track && Number.isFinite(duration) && duration > 0) {
            track.duration = duration;
            renderPlaylist();
            void persistTrack(track);
          }

          let targetTime = null;
          // 用户刷新后直接拖动进度条时，拖动目标必须覆盖旧的恢复位置。
          if (Number.isFinite(duration) && duration > 0 && state.pendingProgressSeekRatio !== null) {
            targetTime = duration * clamp(state.pendingProgressSeekRatio, 0, 1);
            state.pendingProgressSeekRatio = null;
            state.pendingRestoreTime = null;
            state.pendingRestoreTrackId = '';
          } else if (track && state.pendingRestoreTrackId === track.id && state.pendingRestoreTime !== null) {
            targetTime = Number.isFinite(duration)
              ? clamp(state.pendingRestoreTime, 0, Math.max(0, duration - 0.05))
              : state.pendingRestoreTime;
            state.pendingRestoreTime = null;
            state.pendingRestoreTrackId = '';
          }

          if (targetTime !== null) {
            try { ui.audio.currentTime = targetTime; } catch (_) {}
          }
          setNativeOutputDefaults();
          updateProgress();
        });
        ui.audio.addEventListener('durationchange', updateProgress);
        ui.audio.addEventListener('timeupdate', () => {
          updateProgress();
          persistPlaybackPosition(false);
        });
        ui.audio.addEventListener('play', updatePlayButton);
        ui.audio.addEventListener('playing', updatePlayButton);
        ui.audio.addEventListener('pause', () => {
          updatePlayButton();
          persistPlaybackPosition(true);
        });
        ui.audio.addEventListener('ended', () => {
          persistPlaybackPosition(true);
          handleEnded();
        });
        ui.audio.addEventListener('error', () => {
          const sourceSerial = state.sourceSerial;
          const error = ui.audio.error;
          setTimeout(() => {
            if (sourceSerial !== state.sourceSerial) return;
            if (!tryNextMimeSource(sourceSerial)) reportPlaybackError(error);
          }, 0);
        });
        ui.audio.addEventListener('volumechange', () => {
          if (ui.audio.muted || ui.audio.volume !== 1) {
            ui.audio.muted = false;
            ui.audio.volume = 1;
          }
        });
        ui.audio.addEventListener('ratechange', () => {
          if (Math.abs(ui.audio.playbackRate - state.rate) > 0.001) ui.audio.playbackRate = state.rate;
        });

        document.addEventListener('keydown', event => {
          if (event.target.closest('input, button, summary')) return;
          if (event.code === 'Space') { event.preventDefault(); togglePlayback(); }
          if (event.code === 'ArrowLeft') { event.preventDefault(); seekBy(-5); }
          if (event.code === 'ArrowRight') { event.preventDefault(); seekBy(5); }
        });

        document.querySelectorAll('[data-theme-option]').forEach(button => {
          button.addEventListener('click', () => applyTheme(button.dataset.themeOption));
        });

        window.addEventListener('resize', updateTrackNameMarquee);

        window.addEventListener('beforeunload', () => {
          persistPlaybackPosition(true);
          state.tracks.forEach(track => URL.revokeObjectURL(track.url));
          if (state.floatingWindow && !state.floatingWindow.closed) state.floatingWindow.close();
        });
      }

      async function initialize() {
        setNativeOutputDefaults();
        renderPlaylist();
        updatePlayButton();

        const savedTheme = storage.get('english-focus-player-theme', 'pearl');
        const savedOpacity = Number(storage.get('english-focus-player-opacity', 90));
        const savedRate = Number(storage.get('english-focus-player-speed', 1));
        const savedMode = storage.get('english-focus-player-mode', 'sequence');
        const modeIndex = MODES.findIndex(mode => mode.key === savedMode);
        state.modeIndex = modeIndex >= 0 ? modeIndex : 0;
        storage.remove('english-focus-player-sort');

        applyTheme(savedTheme, false);
        setOpacity(Number.isFinite(savedOpacity) ? savedOpacity : 90, false);
        setRate(Number.isFinite(savedRate) ? savedRate : 1, false);
        updateModeButton();
        bindEvents();
        installMediaSessionActions();
        await restorePersistedTracks();
        await ensurePersistentStorage();

        window.__englishListeningPlayer = {
          getState: () => ({
            trackCount: state.tracks.length,
            currentIndex: state.currentIndex,
            paused: ui.audio.paused,
            muted: ui.audio.muted,
            volume: ui.audio.volume,
            currentTime: ui.audio.currentTime,
            duration: ui.audio.duration,
            readyState: ui.audio.readyState,
            networkState: ui.audio.networkState,
            playbackRate: ui.audio.playbackRate,
            reorderMode: state.reorderMode,
            trackOrder: state.tracks.map(track => track.name)
          }),
          applyCustomSort: (primaryField = 'name', primaryDirection = 'asc', secondaryField = '', secondaryDirection = 'asc') => {
            ui.customSortPrimaryField.value = primaryField;
            ui.customSortPrimaryDirection.value = primaryDirection;
            ui.customSortSecondaryField.value = secondaryField;
            ui.customSortSecondaryDirection.value = secondaryDirection;
            ui.customSortSecondaryDirection.disabled = !secondaryField;
            return applyCustomSort();
          },
          undoCustomSort
        };
      }

      initialize().catch(error => {
        state.restoring = false;
        renderPlaylist();
        console.error('播放器初始化失败', error);
        alert(`播放器初始化失败：${error?.message || '未知错误'}`);
      });
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' })
          .catch(error => console.warn('Field Notes offline support could not start:', error));
      });
    }
  </script>
