<!DOCTYPE html>
<html lang="zh-CN" data-theme="pearl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="application-name" content="Field Notes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Field Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta id="themeColorMeta" name="theme-color" content="#f1f2ff">
  <title>Field Notes｜英语听力播放器</title>
  <style>
    :root,
    html[data-theme="pearl"] {
      --page-a: #eee8ff;
      --page-b: #f8f7ff;
      --page-c: #e9efff;
      --surface-rgb: 255, 255, 255;
      --surface-strong: rgba(255, 255, 255, .91);
      --surface-soft: rgba(255, 255, 255, .58);
      --surface-hover: rgba(255, 255, 255, .82);
      --text-main: #34394a;
      --text-muted: #778094;
      --primary: #7062f4;
      --primary-soft: #8f88ff;
      --primary-rgb: 112, 98, 244;
      --track: #e4e8f1;
      --border: rgba(255, 255, 255, .86);
      --shadow: 0 22px 62px rgba(85, 80, 158, .16);
      --theme-color: #f1f2ff;
      --player-alpha: .90;
    }

    html[data-theme="lavender"] {
      --page-a: #eee8ff;
      --page-b: #fbf7ff;
      --page-c: #edf0ff;
      --text-main: #3c3558;
      --text-muted: #7b7294;
      --primary: #8064dc;
      --primary-soft: #ab96ee;
      --primary-rgb: 128, 100, 220;
      --track: #e7e1f2;
      --shadow: 0 22px 62px rgba(104, 80, 159, .17);
      --theme-color: #f3efff;
    }

    html[data-theme="mint"] {
      --page-a: #e8faf5;
      --page-b: #f8fffd;
      --page-c: #edf5ff;
      --text-main: #29443f;
      --text-muted: #708680;
      --primary: #2ba98e;
      --primary-soft: #6bcbb7;
      --primary-rgb: 43, 169, 142;
      --track: #dcebe7;
      --shadow: 0 22px 62px rgba(40, 128, 109, .15);
      --theme-color: #effbf7;
    }

    html[data-theme="sky"] {
      --page-a: #e8f5ff;
      --page-b: #f8fbff;
      --page-c: #eafafa;
      --text-main: #294052;
      --text-muted: #718595;
      --primary: #378dd2;
      --primary-soft: #79b8e7;
      --primary-rgb: 55, 141, 210;
      --track: #dce8f0;
      --shadow: 0 22px 62px rgba(48, 118, 166, .15);
      --theme-color: #eef8ff;
    }

    html[data-theme="peach"] {
      --page-a: #fff0e9;
      --page-b: #fffaf7;
      --page-c: #fff1f5;
      --text-main: #513a34;
      --text-muted: #8f776f;
      --primary: #e47b61;
      --primary-soft: #f2aa97;
      --primary-rgb: 228, 123, 97;
      --track: #f1e2dc;
      --shadow: 0 22px 62px rgba(170, 91, 73, .14);
      --theme-color: #fff6f1;
    }

    html[data-theme="rose"] {
      --page-a: #fff0f7;
      --page-b: #fff9fb;
      --page-c: #f2f0ff;
      --text-main: #4e3547;
      --text-muted: #8b7485;
      --primary: #d75f96;
      --primary-soft: #eb9fc1;
      --primary-rgb: 215, 95, 150;
      --track: #f0e0e8;
      --shadow: 0 22px 62px rgba(160, 75, 117, .15);
      --theme-color: #fff4f9;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text-main);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 8% 14%, rgba(var(--primary-rgb), .18), transparent 30%),
        radial-gradient(circle at 92% 10%, rgba(255, 255, 255, .94), transparent 31%),
        radial-gradient(circle at 78% 88%, rgba(var(--primary-rgb), .12), transparent 34%),
        linear-gradient(135deg, var(--page-a), var(--page-b) 48%, var(--page-c));
      background-attachment: fixed;
      transition: background .35s ease, color .25s ease;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(var(--primary-rgb), .28);
      outline-offset: 3px;
    }

    .app {
      width: min(1160px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .title {
      margin: 4px 0 28px;
      text-align: center;
      font-size: clamp(28px, 4.2vw, 42px);
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--text-main);
    }

    .layout {
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: stretch;
    }
    .layout > *, .player-slot, .player-card { width: 100%; min-width: 0; }

    .glass-card {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(145%);
      -webkit-backdrop-filter: blur(24px) saturate(145%);
      overflow: visible;
    }

    .playlist-card {
      z-index: 30;
      width: 100%;
      background: rgba(var(--surface-rgb), .72);
      padding: clamp(18px, 2.4vw, 24px);
    }
    .player-card {
      z-index: 20;
      overflow: visible;
      background: rgba(var(--surface-rgb), var(--player-alpha));
      padding: clamp(20px, 3vw, 30px);
      transition: background-color .2s ease, box-shadow .25s ease, transform .25s ease;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-head h2 { margin: 0; font-size: 18px; }
    .import-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 13px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-soft));
      box-shadow: 0 9px 22px rgba(var(--primary-rgb), .25);
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }
    .import-button { white-space: nowrap; }
    .import-button input { display: none; }

    .playlist-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .clear-button {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid rgba(214, 83, 100, .18);
      border-radius: 13px;
      color: #c34f60;
      background: rgba(255,255,255,.48);
      cursor: pointer;
      font-weight: 750;
      font-size: 13px;
      transition: color .18s ease, background .18s ease, transform .18s ease, opacity .18s ease;
    }
    .clear-button:hover:not(:disabled) {
      color: #fff;
      background: #d65364;
      transform: translateY(-1px);
    }
    .clear-button:disabled { opacity: .42; cursor: not-allowed; }

    .reorder-button {
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid rgba(var(--primary-rgb), .16);
      border-radius: 13px;
      color: var(--primary);
      background: rgba(255,255,255,.56);
      cursor: pointer;
      font-size: 13px;
      font-weight: 780;
      transition: color .18s ease, background .18s ease, transform .18s ease, opacity .18s ease;
    }

    .reorder-button:hover:not(:disabled) { transform: translateY(-1px); background: rgba(255,255,255,.90); }
    .reorder-button.active,
    .reorder-button.active:hover:not(:disabled),
    .reorder-button.active:focus-visible:not(:disabled) {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--primary), var(--primary-soft));
      box-shadow: 0 9px 22px rgba(var(--primary-rgb), .22);
    }
    .reorder-button:disabled { opacity: .42; cursor: not-allowed; }
    .import-button.is-disabled { opacity: .42; cursor: not-allowed; box-shadow: none; }

    .custom-sort-wrap { position: relative; }

    /*
     * 自定义排序使用 body 直属的视口弹层，不再放在按钮所在卡片内部。
     * backdrop-filter 会让卡片成为 fixed 元素的包含块；旧结构因此可能在竖屏中被裁切或偏移。
     */
    body.custom-sort-open { overflow: hidden; }
    .custom-sort-backdrop {
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(42, 39, 75, .20);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      touch-action: none;
    }
    .custom-sort-backdrop[hidden] { display: none; }
    .custom-sort-menu {
      position: fixed !important;
      z-index: 1001 !important;
      top: 50% !important;
      left: 50% !important;
      right: auto !important;
      bottom: auto !important;
      width: min(430px, calc(100vw - 24px)) !important;
      max-width: none;
      max-height: calc(100vh - 24px);
      max-height: calc(100dvh - 24px);
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      border-radius: 22px;
      transform: translate(-50%, -50%);
      box-shadow: 0 26px 72px rgba(55, 50, 100, .30);
    }
    .custom-sort-menu[hidden] { display: none; }
    .custom-sort-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 16px 13px;
      border-bottom: 1px solid rgba(var(--primary-rgb), .10);
      background: rgba(255,255,255,.97);
    }
    .custom-sort-title-group { min-width: 0; display: flex; align-items: baseline; gap: 9px; }
    .custom-sort-title { font-size: 15px; font-weight: 820; white-space: nowrap; }
    .custom-sort-note { color: var(--text-muted); font-size: 11px; font-weight: 650; white-space: nowrap; }
    .custom-sort-close {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(var(--primary-rgb), .10);
      border-radius: 11px;
      color: var(--text-muted);
      background: rgba(var(--primary-rgb), .045);
      cursor: pointer;
      font-size: 21px;
      line-height: 1;
    }
    .custom-sort-close:hover { color: var(--primary); background: rgba(var(--primary-rgb), .10); }
    .custom-sort-body {
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 14px 16px;
    }
    .custom-sort-grid { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 10px; }
    .custom-sort-field { min-width: 0; display: grid; gap: 6px; color: var(--text-muted); font-size: 12px; font-weight: 750; }
    .custom-sort-field.full { grid-column: 1 / -1; }
    .custom-sort-select {
      width: 100%;
      min-width: 0;
      min-height: 40px;
      padding: 8px 30px 8px 10px;
      border: 1px solid rgba(var(--primary-rgb), .14);
      border-radius: 11px;
      color: var(--text-main);
      background: rgba(var(--primary-rgb), .055);
      cursor: pointer;
      font-size: 13px;
      font-weight: 720;
    }
    .custom-sort-help {
      margin: 11px 0 0;
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.55;
    }
    .custom-sort-actions {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(var(--primary-rgb), .10);
      background: rgba(255,255,255,.97);
    }
    .custom-sort-action {
      min-height: 38px;
      padding: 7px 12px;
      border: 1px solid rgba(var(--primary-rgb), .14);
      border-radius: 11px;
      color: var(--text-muted);
      background: rgba(255,255,255,.60);
      cursor: pointer;
      font-size: 12px;
      font-weight: 780;
      white-space: normal;
    }
    .custom-sort-action:hover:not(:disabled) { color: var(--primary); background: rgba(255,255,255,.94); }
    .custom-sort-action.primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--primary), var(--primary-soft)); }
    .custom-sort-action:disabled { opacity: .4; cursor: not-allowed; }

    .audio-list {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      max-height: 420px;
      overflow: auto;
      padding-right: 4px;
    }
    .audio-list::-webkit-scrollbar { width: 6px; }
    .audio-list::-webkit-scrollbar-thumb { background: rgba(var(--primary-rgb), .26); border-radius: 999px; }

    .empty-list {
      min-height: 170px;
      display: grid;
      place-content: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
    .empty-list { grid-column: 1 / -1; }
    .empty-list svg { width: 36px; height: 36px; margin: 0 auto 10px; opacity: .34; }

    .audio-item {
      position: relative;
      display: grid;
      grid-template-columns: 30px 38px minmax(0, 1fr) 34px;
      align-items: center;
      gap: 9px;
      padding: 10px;
      margin-bottom: 0;
      border: 1px solid transparent;
      border-radius: 15px;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease, opacity .18s ease;
    }
    .audio-item:hover { background: var(--surface-hover); transform: translateY(-1px); }
    .audio-item.active { background: var(--surface-strong); border-color: rgba(var(--primary-rgb), .20); }
    .audio-list.reorder-mode { grid-template-columns: 1fr; }
    .audio-list.reorder-mode .audio-item { cursor: default; }
    .audio-list.reorder-mode .audio-item:hover { transform: none; }
    .audio-list.reorder-mode .delete-button { visibility: hidden; pointer-events: none; }
    .audio-list.dragging-tracks { cursor: grabbing; user-select: none; -webkit-user-select: none; }
    .audio-list.dragging-tracks .audio-item:hover { transform: none; }
    .audio-item.drag-source { opacity: .36; transform: scale(.992); }
    .playlist-drop-indicator {
      position: absolute;
      z-index: 12;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 0 3px rgba(var(--primary-rgb), .13), 0 5px 14px rgba(var(--primary-rgb), .30);
      pointer-events: none;
    }
    .playlist-drop-indicator[hidden] { display: none; }
    .playlist-drop-indicator.horizontal {
      height: 4px;
      min-width: 72px;
    }
    .playlist-drop-indicator.horizontal::before,
    .playlist-drop-indicator.horizontal::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--primary);
      transform: translateY(-50%);
      box-shadow: 0 0 0 3px rgba(var(--primary-rgb), .11);
    }
    .playlist-drop-indicator.horizontal::before { left: -2px; }
    .playlist-drop-indicator.horizontal::after { right: -2px; }
    .drag-handle {
      width: 30px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 10px;
      color: var(--text-muted);
      background: transparent;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .drag-handle:hover:not(:disabled), .drag-handle:focus-visible:not(:disabled) { color: var(--primary); background: rgba(var(--primary-rgb), .08); }
    .drag-handle:active:not(:disabled) { cursor: grabbing; }
    .drag-handle:disabled { opacity: .30; cursor: default; }
    .drag-dots { font-size: 20px; line-height: 1; letter-spacing: -3px; transform: rotate(90deg); }
    .audio-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: var(--primary);
      background: rgba(var(--primary-rgb), .12);
    }
    .audio-icon svg { width: 17px; height: 17px; }
    .audio-meta { min-width: 0; }
    .audio-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: 14px; }
    .audio-duration { margin-top: 3px; color: var(--text-muted); font-size: 12px; }
    .delete-button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 10px;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
    }
    .delete-button:hover { color: #d65364; background: rgba(214, 83, 100, .10); }

    .track-line {
      display: grid;
      grid-template-columns: 46px minmax(76px, auto) minmax(0, 1fr) minmax(76px, auto) 46px;
      align-items: center;
      gap: clamp(10px, 1.7vw, 22px);
      min-height: 52px;
      margin-bottom: 14px;
    }

    .track-name {
      min-width: 0;
      min-height: 34px;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      text-align: center;
      font-size: clamp(16px, 2.2vw, 21px);
      font-weight: 780;
      color: var(--text-main);
      mask-image: linear-gradient(90deg, transparent, #000 10px, #000 calc(100% - 10px), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 10px, #000 calc(100% - 10px), transparent);
    }
    .track-name-text {
      display: inline-block;
      min-width: 100%;
      padding: 0 12px;
      text-align: center;
      will-change: transform;
    }
    .track-name.is-overflowing .track-name-text {
      min-width: max-content;
      text-align: left;
      animation: track-name-scroll var(--marquee-duration, 9s) ease-in-out 1s infinite alternate;
    }
    .track-name:hover .track-name-text { animation-play-state: paused; }
    @keyframes track-name-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(calc(-1 * var(--marquee-distance, 0px))); }
    }

    .track-nav-button {
      min-width: 76px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 12px;
      border: 1px solid rgba(var(--primary-rgb), .11);
      border-radius: 13px;
      color: var(--text-muted);
      background: rgba(255,255,255,.48);
      cursor: pointer;
      font-size: 13px;
      font-weight: 780;
      white-space: nowrap;
      transition: transform .18s ease, color .18s ease, background .18s ease, opacity .18s ease;
    }
    .track-nav-button:hover:not(:disabled) { transform: translateY(-1px); color: var(--primary); background: rgba(255,255,255,.86); }
    .track-nav-button:disabled { opacity: .38; cursor: not-allowed; }
    .track-nav-button .nav-arrow { font-size: 12px; }

    .icon-button {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(120, 128, 151, .12);
      border-radius: 15px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, .54);
      box-shadow: 0 7px 18px rgba(77, 86, 119, .08), inset 0 1px 0 rgba(255,255,255,.72);
      cursor: pointer;
      transition: transform .18s ease, color .18s ease, background .18s ease;
    }
    .icon-button:hover { transform: translateY(-1px); color: var(--primary); background: rgba(255,255,255,.86); }
    .icon-button svg { width: 21px; height: 21px; }

    .popover-wrap { position: relative; }
    .popover {
      position: absolute;
      z-index: 40;
      top: calc(100% + 10px);
      left: 0;
      width: 240px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--text-main);
      background: rgba(255,255,255,.96);
      box-shadow: 0 18px 44px rgba(72, 78, 118, .18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .popover.right { left: auto; right: 0; }
    .popover.up {
      top: auto;
      bottom: calc(100% + 10px);
    }
    .popover[hidden] { display: none; }
    .popover-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 11px; font-size: 14px; font-weight: 800; }
    .speed-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 12px; }
    .speed-preset {
      padding: 7px 4px;
      border: 1px solid rgba(var(--primary-rgb), .12);
      border-radius: 10px;
      color: var(--text-muted);
      background: rgba(var(--primary-rgb), .06);
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
    }
    .speed-preset.active { color: #fff; background: var(--primary); }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .progress {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: var(--track);
      cursor: pointer;
      touch-action: none;
      box-shadow: inset 0 1px 2px rgba(75, 82, 107, .09);
    }
    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary-soft), var(--primary));
    }
    .progress-handle {
      position: absolute;
      top: 50%;
      left: 0;
      width: 18px;
      height: 18px;
      border: 4px solid var(--primary);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 5px 15px rgba(var(--primary-rgb), .32);
      transform: translate(-50%, -50%) scale(.75);
      opacity: 0;
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
    }
    .progress:hover .progress-handle, .progress.dragging .progress-handle { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .transport {
      display: grid;

    .range-line { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    input[type="range"] {

    .theme-accordion {

      box-shadow: 0 14px 36px rgba(75, 82, 118, .10);

    .theme-accordion summary {

    .theme-accordion summary::-webkit-details-marker { display: none; }
    .summary-right { display: inline-flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 13px; }
    .chevron { width: 18px; height: 18px; transition: transform .2s ease; }

    .theme-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 9px; padding: 0 18px 18px; }
    .theme-choice {

    .theme-choice.active { color: var(--text-main); background: rgba(255,255,255,.90); border-color: rgba(var(--primary-rgb), .30); box-shadow: 0 7px 18px rgba(var(--primary-rgb), .10); }
    .swatch { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(70,78,104,.13); }
    .swatch.pearl { background: linear-gradient(135deg,#7365f4,#f3bbd4); }
    .swatch.lavender { background: linear-gradient(135deg,#8064dc,#c5adf1); }
    .swatch.mint { background: linear-gradient(135deg,#2ba98e,#9edecf); }
    .swatch.sky { background: linear-gradient(135deg,#378dd2,#9cd8f4); }
    .swatch.peach { background: linear-gradient(135deg,#e47b61,#f6c0ad); }
    .swatch.rose { background: linear-gradient(135deg,#d75f96,#efb2cf); }

    .fallback-floating {
      position: fixed !important;
      z-index: 1000;

    @media (max-width: 710px) {

      .track-line { grid-template-columns: 42px minmax(62px, auto) minmax(0, 1fr) minmax(62px, auto) 42px; gap: 7px; }
      .track-nav-button { min-width: 62px; min-height: 38px; padding: 7px 8px; font-size: 12px; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .playlist-actions { width: 100%; justify-content: flex-start; }
      .reorder-button { flex: 0 0 auto; }
      .custom-sort-menu {

        right: 10px !important;
        bottom: max(10px, env(safe-area-inset-bottom)) !important;
        width: auto !important;
        max-height: calc(100vh - 20px - env(safe-area-inset-bottom));
        max-height: calc(100dvh - 20px - env(safe-area-inset-bottom));

      .glass-card { border-radius: 22px; }

      /*
       * 窄屏/竖屏时仍以播放键为中心保持左右完全对称：
       * -15  -5   [播放]   +5  +15
       *  -3  -2   [播放]   +2  +3
       * 播放键跨两行，窗口横竖切换后不会再出现“后退一整行、前进一整行”的失衡布局。
       */
      .transport {
        grid-template-columns: repeat(2, minmax(0, 1fr)) clamp(64px, 16vw, 74px) repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, auto);
        gap: 8px 6px;
        margin: 24px 0 20px;
      }
      .transport > * { min-width: 0; }
      .play-button {
        grid-column: 3;
        grid-row: 1 / 3;

        justify-self: center;
        width: 68px;
        height: 68px;
        margin: 0;
      }
      .play-button svg { width: 25px; height: 25px; }
      .seek-button { font-size: 13px; padding: 10px 2px; }

      .transport > .seek-button:nth-child(1) { grid-column: 1; grid-row: 1; }
      .transport > .seek-button:nth-child(2) { grid-column: 2; grid-row: 1; }
      .transport > .seek-button:nth-child(3) { grid-column: 1; grid-row: 2; }
      .transport > .seek-button:nth-child(4) { grid-column: 2; grid-row: 2; }
      .transport > .seek-button:nth-child(6) { grid-column: 4; grid-row: 2; }
      .transport > .seek-button:nth-child(7) { grid-column: 5; grid-row: 2; }
      .transport > .seek-button:nth-child(8) { grid-column: 4; grid-row: 1; }
      .transport > .seek-button:nth-child(9) { grid-column: 5; grid-row: 1; }

      .theme-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 430px) {

    /* =========================================================
       参考图风格：全设备自适应听力播放区
       - 控制区以播放器卡片自身宽度为依据，而不是只依赖屏幕宽度
       - 横屏、竖屏、桌面、平板、手机以及悬浮窗都能保持对称布局
       - 竖屏播放列表交由页面统一滚动，避免内部滚动到底后锁住页面
       ========================================================= */
    .player-card {
      container-name: player;
      container-type: inline-size;
      padding: clamp(18px, 3vw, 32px);
    }

    .track-line {
      grid-template-columns: 46px minmax(78px, auto) minmax(0, 1fr) minmax(78px, auto) 46px;
      gap: clamp(8px, 1.5vw, 18px);
      margin-bottom: 16px;
    }

    .transport {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(76px, 10vw, 104px) minmax(0, 1fr);
      grid-template-areas: "rewind-grid play forward-grid";
      align-items: center;
      column-gap: clamp(14px, 3vw, 42px);
      margin: clamp(20px, 3.5vw, 32.5px) 0 clamp(18px, 2.6vw, 26px);
      padding-inline: clamp(0px, 1vw, 10px);
    }

    .seek-group { display: contents; }
    .seek-group.rewind .seek-grid { grid-area: rewind-grid; }
    .seek-group.forward .seek-grid { grid-area: forward-grid; }

    .seek-grid {
      width: min(100%, 242px);
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(8px, 1.3vw, 13px);
      justify-self: center;
    }

    .seek-button {
      width: 100%;
      min-width: 0;
      min-height: clamp(54px, 7vw, 72px);
      display: grid;
      place-items: center;
      padding: 9px 4px;
      border: 1px solid rgba(var(--primary-rgb), .10);
      border-radius: clamp(14px, 1.7vw, 19px);
      color: var(--text-main);
      background:
        linear-gradient(145deg, rgba(255,255,255,.84), rgba(var(--primary-rgb),.045));
      box-shadow:
        0 9px 20px rgba(70, 75, 110, .08),
        inset 0 1px 0 rgba(255,255,255,.88);
      cursor: pointer;
      font-size: clamp(13px, 1.65vw, 17px);
      font-weight: 820;
      line-height: 1;
      white-space: nowrap;
      transition: transform .18s ease, color .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .seek-button:hover {
      color: var(--primary);
      border-color: rgba(var(--primary-rgb), .22);
      background: rgba(255,255,255,.92);
      box-shadow: 0 12px 25px rgba(var(--primary-rgb), .13), inset 0 1px 0 rgba(255,255,255,.94);
      transform: translateY(-2px);
    }

    .seek-button:active { transform: translateY(0) scale(.98); }
    .seek-button .seek-unit { margin-left: .04em; font-size: .86em; font-weight: 760; }

    .play-stage {
      grid-area: play;
      position: relative;
      display: grid;
      place-items: center;
      align-self: center;
      justify-self: center;
      isolation: isolate;
    }

    .play-stage::before {
      content: '';
      position: absolute;
      z-index: -1;
      width: calc(100% + clamp(18px, 2.8vw, 34px));
      height: calc(100% + clamp(18px, 2.8vw, 34px));
      border-radius: 50%;
      background: rgba(var(--primary-rgb), .075);
      box-shadow: 0 0 34px rgba(var(--primary-rgb), .13);
    }

    .play-button {
      width: clamp(76px, 10vw, 104px);
      height: clamp(76px, 10vw, 104px);
      box-shadow:
        0 18px 36px rgba(var(--primary-rgb), .34),
        0 0 0 clamp(8px, 1vw, 12px) rgba(var(--primary-rgb), .055),
        inset 0 1px 0 rgba(255,255,255,.42);
    }

    .play-button:hover {
      box-shadow:
        0 22px 42px rgba(var(--primary-rgb), .39),
        0 0 0 clamp(9px, 1.1vw, 13px) rgba(var(--primary-rgb), .065),
        inset 0 1px 0 rgba(255,255,255,.48);
    }

    .play-button svg { width: clamp(27px, 3.5vw, 37px); height: clamp(27px, 3.5vw, 37px); }

    .bottom-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      justify-content: initial;
      gap: clamp(10px, 3vw, 28px);
      margin-top: 4px;
    }

    .bottom-tools > :first-child { justify-self: start; }
    .bottom-tools > :last-child { justify-self: end; }
    .text-tool { min-height: 44px; padding: 8px 12px; font-size: clamp(13px, 1.5vw, 16px); }
    .text-tool svg { width: clamp(19px, 2vw, 22px); height: clamp(19px, 2vw, 22px); }

    /* 播放列表标题与操作区参考图式排列 */
    .section-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .section-head h2 { font-size: clamp(20px, 2.7vw, 27px); }
    .section-head > .import-button { justify-self: end; min-height: 48px; padding: 10px 18px; border-radius: 18px; font-size: 15px; }

    .playlist-actions {
      grid-column: 1 / -1;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(8px, 1.6vw, 14px);
    }

    .playlist-actions > *,
    .playlist-actions .reorder-button,
    .playlist-actions .clear-button {
      width: 100%;
      min-width: 0;
    }

    .playlist-actions .reorder-button,
    .playlist-actions .clear-button {

      font-size: clamp(12px, 1.35vw, 14px);

    .playlist-actions .custom-sort-wrap { display: block; }

    @container player (max-width: 620px) {

      .track-name { min-height: 32px; font-size: clamp(15px, 4.5vw, 19px); }

      .transport {

        padding-inline: 0;
      }

      .seek-grid { gap: clamp(6px, 1.8cqw, 10px); }
      .seek-button {
        min-height: clamp(48px, 15cqw, 60px);
        border-radius: clamp(13px, 4cqw, 17px);
        font-size: clamp(12px, 3.8cqw, 15px);
        padding-inline: 1px;
      }

      .play-button { width: clamp(66px, 18cqw, 84px); height: clamp(66px, 18cqw, 84px); }
      .play-button svg { width: clamp(24px, 7cqw, 30px); height: clamp(24px, 7cqw, 30px); }
    }

    @container player (max-width: 390px) {
      .player-card { padding: 16px 13px 18px; }
      .track-line { grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 40px; column-gap: 5px; }
      .icon-button { width: 40px; height: 40px; border-radius: 12px; }
      .track-nav-button { min-height: 38px; font-size: 11px; }
      .track-nav-button .nav-arrow { display: none; }

      .transport {
        grid-template-columns: minmax(0, 1fr) clamp(58px, 18cqw, 68px) minmax(0, 1fr);
        column-gap: 5px;
        margin: 20px 0 17px;
      }

      .seek-grid { gap: 5px; }
      .seek-button {
        min-height: clamp(44px, 14cqw, 52px);
        border-radius: 13px;
        font-size: clamp(11px, 3.6cqw, 13px);
      }
      .play-button { width: clamp(58px, 18cqw, 68px); height: clamp(58px, 18cqw, 68px); }
      .play-stage::before { width: calc(100% + 16px); height: calc(100% + 16px); }
      .bottom-tools { gap: 6px; }
      .text-tool { min-width: 0; padding-inline: 7px; font-size: 12.5px; gap: 6px; }

    @container player (max-width: 310px) {
      .seek-button .seek-unit { display: none; }

      .text-tool { font-size: 11.5px; }
    }

    @media (max-width: 710px) {
      .section-head {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
      }
      .section-head > .import-button { min-height: 44px; padding: 9px 14px; }
      .playlist-actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    @media (max-width: 430px) {
      .playlist-card { padding: 16px 14px; }

    @media (max-height: 560px) and (orientation: landscape) {
      .app { padding-top: 8px; padding-bottom: 22px; }
      .title { margin: 0 0 10px; font-size: clamp(26px, 5.5vh, 32px); }
      .player-card { padding-block: 12px; }
      .track-line { min-height: 44px; margin-bottom: 4px; }
      .time-row { margin-bottom: 5px; font-size: 12px; }
      /* 手机及小尺寸平板横屏时，增大进度条与快进/快退按钮的垂直间距，避免拥挤和误触。 */
      .transport { margin: clamp(18px, 5vh, 24px) 0 8px; }
      .seek-button { min-height: 40px; padding-block: 7px; }
      .play-button { width: 68px; height: 68px; }
      .play-button svg { width: 25px; height: 25px; }
      .play-stage::before { width: calc(100% + 18px); height: calc(100% + 18px); }
      .bottom-tools { margin-top: 0; }
      .text-tool { min-height: 36px; padding-block: 5px; }
    }

    /*
       竖屏继续保留播放列表自身的滚动高度，同时允许滚动链向页面无缝传递。
       JavaScript 会把一次手势中列表无法继续消耗的剩余距离立即交给整页，
       因此到达列表顶部或底部时无需松手，也不会先卡一下。
    */
    @media (orientation: portrait) {
      html,
      body {
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: auto;
      }

      .audio-list {
        max-height: min(42dvh, 360px);
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: auto;
        -webkit-overflow-scrolling: touch;
        /* 由脚本统一分配列表与页面的滚动距离，避免浏览器在边界处重新起手势。 */
        touch-action: none;
      }

      .audio-list:not(.reorder-mode) .audio-item,
      .audio-list:not(.reorder-mode) .drag-handle:disabled,
      .playlist-card {
        touch-action: pan-y;
      }

      .app {
        padding-bottom: max(42px, calc(24px + env(safe-area-inset-bottom)));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition-duration: .01ms !important; }
    }


    /* 修复快退/快进按钮中数字与“秒”的字号、字体和基线不一致 */
    .seek-button {
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei",
        "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", sans-serif;
      font-variant-numeric: tabular-nums;
    }

    .seek-button > span {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      line-height: 1;
    }

    .seek-button .seek-unit {
      margin-left: 0;
      font-size: 1em;
      font-weight: inherit;
      line-height: inherit;
      letter-spacing: 0;
    }

  </style>
</head>
<body>
  <div class="app">

  <div id="customSortBackdrop" class="custom-sort-backdrop" hidden></div>

  <audio id="audioPlayer" preload="auto" playsinline></audio>

  <script>
    (() => {
      'use strict';

      const $ = id => document.getElementById(id);
      const ui = {
        audio: $('audioPlayer'),
        fileInput: $('fileInput'),
        clearButton: $('clearButton'),
        reorderButton: $('reorderButton'),
        customSortButton: $('customSortButton'),
        customSortBackdrop: $('customSortBackdrop'),
        customSortMenu: $('customSortMenu'),
        customSortCloseButton: $('customSortCloseButton'),
        customSortPrimaryField: $('customSortPrimaryField'),
        customSortPrimaryDirection: $('customSortPrimaryDirection'),
        customSortSecondaryField: $('customSortSecondaryField'),
        customSortSecondaryDirection: $('customSortSecondaryDirection'),
        customSortUndoButton: $('customSortUndoButton'),
        customSortCancelButton: $('customSortCancelButton'),
        customSortApplyButton: $('customSortApplyButton'),
        audioList: $('audioList'),
        playerSlot: $('playerSlot'),
        playerCard: $('playerCard'),
        trackName: $('trackName'),
        trackNameText: $('trackNameText'),
        previousButton: $('previousButton'),
        nextButton: $('nextButton'),
        currentTime: $('currentTime'),
        duration: $('duration'),
        progress: $('progress'),
        progressFill: $('progressFill'),
        progressHandle: $('progressHandle'),
        playButton: $('playButton'),
        playIcon: $('playIcon'),
        modeButton: $('modeButton'),
        modeIcon: $('modeIcon'),
        speedButton: $('speedButton'),
        speedMenu: $('speedMenu'),
        speedRange: $('speedRange'),
        speedValue: $('speedValue'),
        speedPresets: $('speedPresets'),
        opacityButton: $('opacityButton'),
        opacityMenu: $('opacityMenu'),
        opacityRange: $('opacityRange'),
        opacityValue: $('opacityValue'),
        opacityRangeValue: $('opacityRangeValue'),
        floatingButton: $('floatingButton'),
        floatingLabel: $('floatingLabel'),
        themeCurrentName: $('themeCurrentName'),
        themeColorMeta: $('themeColorMeta')
      };

      const SVG = {
        play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.3 5.2a1 1 0 0 1 1.52-.85l9.1 6.8a1.06 1.06 0 0 1 0 1.7l-9.1 6.8a1 1 0 0 1-1.52-.85V5.2Z"/></svg>',
        pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5.5A1.5 1.5 0 0 1 8.5 4h1A1.5 1.5 0 0 1 11 5.5v13A1.5 1.5 0 0 1 9.5 20h-1A1.5 1.5 0 0 1 7 18.5v-13Zm6 0A1.5 1.5 0 0 1 14.5 4h1A1.5 1.5 0 0 1 17 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5v-13Z"/></svg>',
        sequence: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h12"/><path d="m14 4 3 3-3 3"/><path d="M20 17H8"/><path d="m10 14-3 3 3 3"/></svg>',
        repeatOne: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M3 11V9a4 4 0 0 1 4-4h13"/><path d="m7 22-3-3 3-3"/><path d="M21 13v2a4 4 0 0 1-4 4H4"/><path d="M12 9v6"/></svg>',
        shuffle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>',
        music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>'
      };

      const MODES = [
        { key: 'sequence', label: '顺序播放', icon: SVG.sequence },
        { key: 'repeat-one', label: '单曲循环', icon: SVG.repeatOne },
        { key: 'shuffle', label: '随机播放', icon: SVG.shuffle }
      ];

      const THEMES = {
        pearl: '珍珠幻彩',
        lavender: '淡紫云雾',
        mint: '薄荷清露',
        sky: '晴空水蓝',
        peach: '蜜桃晨光',
        rose: '樱粉柔光'
      };

      const AUDIO_EXTENSIONS = new Set([
        'mp3', 'wav', 'wave', 'm4a', 'm4b', 'aac', 'adts', 'flac', 'ogg', 'oga', 'opus',
        'webm', 'mp4', 'aiff', 'aif', 'caf', 'amr', '3gp', '3gpp', 'wma', 'ac3', 'ec3'
      ]);

      // 同一音频后缀在桌面端和移动端的文件选择器中，可能返回不同 MIME。
      // 第一项使用规范 MIME；后续项用于移动端解码器拒绝规范 MIME 时自动重试。
      const AUDIO_MIME_CANDIDATES_BY_EXTENSION = {
        mp3: ['audio/mpeg'],
        wav: ['audio/wav', 'audio/x-wav'],
        wave: ['audio/wav', 'audio/x-wav'],
        m4a: ['audio/mp4', 'audio/x-m4a', 'video/mp4'],
        m4b: ['audio/mp4', 'audio/x-m4a', 'video/mp4'],
        mp4: ['audio/mp4', 'video/mp4'],
        aac: ['audio/aac', 'audio/x-aac', 'audio/aacp'],
        adts: ['audio/aac', 'audio/x-aac', 'audio/aacp'],
        flac: ['audio/flac', 'audio/x-flac'],
        ogg: ['audio/ogg'],
        oga: ['audio/ogg'],
        opus: ['audio/opus', 'audio/ogg'],
        webm: ['audio/webm'],
        aiff: ['audio/aiff', 'audio/x-aiff'],
        aif: ['audio/aiff', 'audio/x-aiff'],
        caf: ['audio/x-caf'],
        amr: ['audio/amr'],
        '3gp': ['audio/3gpp', 'video/3gpp'],
        '3gpp': ['audio/3gpp', 'video/3gpp'],
        wma: ['audio/x-ms-wma'],
        ac3: ['audio/ac3'],
        ec3: ['audio/eac3']
      };

      const DB_NAME = 'english-focus-player-audio-library';
      const DB_VERSION = 1;
      const TRACK_STORE = 'tracks';

      const state = {
        tracks: [],
        currentIndex: -1,
        rate: 1,
        modeIndex: 0,
        seeking: false,
        restoring: true,
        pendingRestoreTime: null,
        pendingRestoreTrackId: '',
        lastStoredPlaybackSecond: -1,
        floatingWindow: null,
        fallbackFloating: false,
        placeholder: null,
        sourceSerial: 0,
        lastErrorKey: '',
        persistenceWarningShown: false,
        persistentStorageGranted: false,
        pendingProgressSeekRatio: null,
        playRequestSerial: 0,
        playIntent: false,
        mimeRetrying: false,
        reorderMode: false,
        playlistDragActive: false,
        playlistRenderPending: false,
        customSortUndoIds: []
      };

      let importQueue = Promise.resolve();
      let orderPersistQueue = Promise.resolve();
      let orderPersistRevision = 0;

      const storage = {
        get(key, fallback = null) {
          try {
            const value = localStorage.getItem(key);
            return value === null ? fallback : value;
          } catch (_) {
            return fallback;
          }
        },
        set(key, value) {
          try { localStorage.setItem(key, String(value)); } catch (_) {}
        },
        remove(key) {
          try { localStorage.removeItem(key); } catch (_) {}
        }
      };

      const audioStore = {
        dbPromise: null,

        open() {
          if (this.dbPromise) return this.dbPromise;
          this.dbPromise = new Promise((resolve, reject) => {
            if (!('indexedDB' in window)) {
              reject(new Error('当前浏览器不支持 IndexedDB。'));
              return;
            }

            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.addEventListener('upgradeneeded', () => {
              const db = request.result;
              if (!db.objectStoreNames.contains(TRACK_STORE)) {
                const store = db.createObjectStore(TRACK_STORE, { keyPath: 'id' });
                store.createIndex('order', 'order', { unique: false });
              }
            });
            request.addEventListener('success', () => resolve(request.result));
            request.addEventListener('error', () => reject(request.error || new Error('无法打开音频数据库。')));
            request.addEventListener('blocked', () => reject(new Error('音频数据库被其他页面占用，请关闭旧页面后重试。')));
          }).catch(error => {
            this.dbPromise = null;
            throw error;
          });
          return this.dbPromise;
        },

        async getAll() {
          const db = await this.open();
          return new Promise((resolve, reject) => {
            const transaction = db.transaction(TRACK_STORE, 'readonly');
            const request = transaction.objectStore(TRACK_STORE).getAll();
            request.addEventListener('success', () => resolve(request.result || []));
            request.addEventListener('error', () => reject(request.error || transaction.error));
            transaction.addEventListener('abort', () => reject(transaction.error || new Error('读取音频库失败。')));
          });
        },

        async put(track, orderOverride = null) {
          const db = await this.open();
          return new Promise((resolve, reject) => {
            const transaction = db.transaction(TRACK_STORE, 'readwrite');
            const store = transaction.objectStore(TRACK_STORE);
            const request = store.get(track.id);

            request.addEventListener('success', () => {
              const existing = request.result || null;
              // 音频元数据、时长、MIME 等异步保存必须保留数据库里已经确认的顺序。
              // 只有显式传入 orderOverride 时，才允许改动 order。
              const preservedOrder = existing && Number.isFinite(Number(existing.order))
                ? Number(existing.order)
                : null;
              const resolvedOrder = Number.isFinite(orderOverride)
                ? Number(orderOverride)
                : (preservedOrder ?? (Number.isFinite(track.order) ? track.order : Date.now()));
              const record = {
                id: track.id,
                blob: track.blob,
                fileName: track.fileName,
                name: track.name,
                type: track.blob?.type || track.type || '',
                lastModified: track.lastModified || 0,
                size: track.blob?.size || track.size || 0,
                duration: Number.isFinite(track.duration) ? track.duration : 0,
                addedAt: track.addedAt || Date.now(),
                order: resolvedOrder
              };
              store.put(record);
            });
            request.addEventListener('error', () => {
              try { transaction.abort(); } catch (_) {}
            });
            transaction.addEventListener('complete', () => resolve());
            transaction.addEventListener('error', () => reject(transaction.error || new Error('保存音频失败。')));
            transaction.addEventListener('abort', () => reject(transaction.error || new Error('保存音频被中止。')));
          });
        },

        async updateOrders(entries) {
          const updates = Array.from(entries || []).filter(entry => entry?.id && Number.isFinite(entry.order));
          if (!updates.length) return;
          const db = await this.open();
          return new Promise((resolve, reject) => {
            const transaction = db.transaction(TRACK_STORE, 'readwrite');
            const store = transaction.objectStore(TRACK_STORE);

            // 所有顺序更新放在同一个事务中提交，避免逐条写入时留下“半新半旧”的中间顺序。
            updates.forEach(entry => {
              const request = store.get(entry.id);
              request.addEventListener('success', () => {
                const record = request.result;
                if (!record) return;
                record.order = entry.order;
                store.put(record);
              });
              request.addEventListener('error', () => {
                try { transaction.abort(); } catch (_) {}
              });
            });

            transaction.addEventListener('complete', () => resolve());
            transaction.addEventListener('error', () => reject(transaction.error || new Error('保存播放顺序失败。')));
            transaction.addEventListener('abort', () => reject(transaction.error || new Error('保存播放顺序被中止。')));
          });
        },

        async delete(id) {
          const db = await this.open();
          return new Promise((resolve, reject) => {
            const transaction = db.transaction(TRACK_STORE, 'readwrite');
            transaction.objectStore(TRACK_STORE).delete(id);
            transaction.addEventListener('complete', () => resolve());
            transaction.addEventListener('error', () => reject(transaction.error || new Error('删除已保存音频失败。')));
            transaction.addEventListener('abort', () => reject(transaction.error || new Error('删除操作被中止。')));
          });
        },

        async clear() {
          const db = await this.open();
          return new Promise((resolve, reject) => {
            const transaction = db.transaction(TRACK_STORE, 'readwrite');
            transaction.objectStore(TRACK_STORE).clear();
            transaction.addEventListener('complete', () => resolve());
            transaction.addEventListener('error', () => reject(transaction.error || new Error('清空已保存音频失败。')));
            transaction.addEventListener('abort', () => reject(transaction.error || new Error('清空操作被中止。')));
          });
        }
      };

      async function ensurePersistentStorage() {
        if (!navigator.storage) return false;
        try {
          if (typeof navigator.storage.persisted === 'function') {
            const alreadyPersistent = await navigator.storage.persisted();
            if (alreadyPersistent) {
              state.persistentStorageGranted = true;
              return true;
            }
          }
          if (typeof navigator.storage.persist !== 'function') return false;
          state.persistentStorageGranted = Boolean(await navigator.storage.persist());
          return state.persistentStorageGranted;
        } catch (error) {
          console.warn('无法申请持久化存储权限', error);
          return false;
        }
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function formatTime(value) {
        const seconds = Number(value);
        if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
        const whole = Math.floor(seconds);
        const hours = Math.floor(whole / 3600);
        const minutes = Math.floor((whole % 3600) / 60);
        const secs = whole % 60;
        if (hours > 0) {
          return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
        return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function cleanName(filename) {
        return String(filename || '未命名音频').replace(/\.[^.]+$/, '');
      }

      function fileExtension(filename) {
        const match = String(filename || '').toLowerCase().match(/\.([a-z0-9]+)$/);
        return match ? match[1] : '';
      }

      function isLikelyAudio(file) {
        const declaredType = String(file?.type || '').toLowerCase();
        return Boolean(file && (declaredType.startsWith('audio/') || AUDIO_EXTENSIONS.has(fileExtension(file.name))));
      }

      function audioMimeCandidates(filename, declaredType = '') {
        const extension = fileExtension(filename);
        const declared = String(declaredType || '').toLowerCase().split(';')[0].trim();
        const inferred = AUDIO_MIME_CANDIDATES_BY_EXTENSION[extension] || [];
        const candidates = [...inferred];
        if (declared && declared !== 'application/octet-stream') candidates.push(declared);
        return [...new Set(candidates.filter(Boolean))];
      }

      function normalizeAudioBlob(blob, filename = blob?.name, forcedType = '') {
        if (!(blob instanceof Blob)) return blob;
        const currentType = String(blob.type || '').toLowerCase().split(';')[0].trim();
        const candidates = audioMimeCandidates(filename, currentType);
        const targetType = String(forcedType || candidates[0] || currentType).toLowerCase();
        // 即使手机返回 audio/x-m4a 或 audio/x-aac，也统一改成规范 MIME，
        // 不能只判断它是否以 audio/ 开头。
        if (!targetType || currentType === targetType) return blob;
        return new Blob([blob], { type: targetType });
      }

      function ensureTrackMimeState(track) {
        if (!track) return [];
        const candidates = audioMimeCandidates(track.fileName, track.type || track.blob?.type || '');
        track.mimeCandidates = candidates.length ? candidates : [track.type || track.blob?.type || ''].filter(Boolean);
        const currentType = String(track.blob?.type || track.type || '').toLowerCase();
        const currentIndex = track.mimeCandidates.indexOf(currentType);
        track.mimeIndex = currentIndex >= 0 ? currentIndex : 0;
        return track.mimeCandidates;
      }

      function applyTrackMimeCandidate(track, index) {
        const candidates = ensureTrackMimeState(track);
        if (!track || index < 0 || index >= candidates.length) return false;
        const nextType = candidates[index];
        const nextBlob = normalizeAudioBlob(track.blob, track.fileName, nextType);
        const oldUrl = track.url;
        track.blob = nextBlob;
        track.file = nextBlob;
        track.type = nextBlob.type || nextType;
        track.mimeIndex = index;
        track.url = URL.createObjectURL(nextBlob);
        if (oldUrl) setTimeout(() => URL.revokeObjectURL(oldUrl), 3000);
        return true;
      }

      function notifyPersistenceIssue(error, action = '保存') {
        console.error(`音频${action}失败`, error);
        if (state.persistenceWarningShown) return;
        state.persistenceWarningShown = true;
        const quotaHint = error?.name === 'QuotaExceededError'
          ? '浏览器可用存储空间不足，请删除部分已导入音频或清理站点数据。'
          : '当前浏览器可能禁止本地文件页面使用持久化存储，刷新后新增音频可能无法恢复。';
        alert(`音频${action}失败。${quotaHint}`);
      }

      function trackFromRecord(record) {
        if (!record?.id || !(record.blob instanceof Blob)) return null;
        const fileName = record.fileName || `${record.name || '未命名音频'}`;
        const mimeCandidates = audioMimeCandidates(fileName, record.type || record.blob.type || '');
        const blob = normalizeAudioBlob(record.blob, fileName, mimeCandidates[0] || '');
        return {
          id: record.id,
          blob,
          file: blob,
          fileName,
          url: URL.createObjectURL(blob),
          name: record.name || cleanName(fileName),
          type: blob.type || record.type || record.blob.type || '',
          mimeCandidates,
          mimeIndex: 0,
          mimeRepaired: blob.type !== record.blob.type,
          lastModified: Number(record.lastModified) || 0,
          size: Number(record.size) || blob.size || 0,
          duration: Number(record.duration) || 0,
          addedAt: Number(record.addedAt) || Date.now(),
          order: Number(record.order) || Number(record.addedAt) || Date.now()
        };
      }

      async function persistTrack(track, orderOverride = null) {
        try {
          await audioStore.put(track, orderOverride);
          return true;
        } catch (error) {
          notifyPersistenceIssue(error, '保存');
          return false;
        }
      }

      async function restorePersistedTracks() {
        try {
          const records = await audioStore.getAll();
          records
            .sort((a, b) => {
              const byOrder = (Number(a.order) || 0) - (Number(b.order) || 0);
              if (byOrder) return byOrder;
              const byAdded = (Number(a.addedAt) || 0) - (Number(b.addedAt) || 0);
              return byAdded || String(a.id || '').localeCompare(String(b.id || ''));
            })
            .map(trackFromRecord)
            .filter(Boolean)
            .forEach(track => state.tracks.push(track));

          const savedTrackId = storage.get('english-focus-player-current-id', '');
          const savedTime = Number(storage.get('english-focus-player-current-time', 0));
          const savedIndex = state.tracks.findIndex(track => track.id === savedTrackId);

          state.restoring = false;
          renderPlaylist();
          // 把旧版本可能留下的重复、过大或不连续 order 统一规范化一次。
          // 只按当前已恢复的可见顺序编号，不执行任何名称/时长/导入时间排序。
          if (state.tracks.length) void persistTrackOrder();
          if (state.tracks.length) {
            loadTrack(savedIndex >= 0 ? savedIndex : 0, false, Number.isFinite(savedTime) ? savedTime : 0);
            state.tracks.filter(track => !track.duration).forEach(probeDuration);
            state.tracks.filter(track => track.mimeRepaired).forEach(track => {
              track.mimeRepaired = false;
              void persistTrack(track);
            });
          }
        } catch (error) {
          state.restoring = false;
          renderPlaylist();
          notifyPersistenceIssue(error, '恢复');
        }
      }

      function persistPlaybackPosition(force = false) {
        const track = activeTrack();
        if (!track) return;
        const current = Number(ui.audio.currentTime) || 0;
        const wholeSecond = Math.floor(current);
        if (!force && Math.abs(wholeSecond - state.lastStoredPlaybackSecond) < 2) return;
        state.lastStoredPlaybackSecond = wholeSecond;
        storage.set('english-focus-player-current-id', track.id);
        storage.set('english-focus-player-current-time', current.toFixed(3));
      }

      function activeTrack() {
        return state.currentIndex >= 0 ? state.tracks[state.currentIndex] : null;
      }

      function setNativeOutputDefaults() {
        ui.audio.defaultMuted = false;
        ui.audio.muted = false;
        ui.audio.volume = 1;
        ui.audio.playbackRate = state.rate;
        ui.audio.defaultPlaybackRate = state.rate;
        if ('preservesPitch' in ui.audio) ui.audio.preservesPitch = true;
        if ('webkitPreservesPitch' in ui.audio) ui.audio.webkitPreservesPitch = true;
      }

      function updatePlayButton() {
        const playing = !ui.audio.paused && !ui.audio.ended;
        ui.playIcon.innerHTML = playing ? SVG.pause : SVG.play;
        ui.playButton.setAttribute('aria-label', playing ? '暂停' : '播放');
        ui.playButton.title = playing ? '暂停' : '播放';
        if ('mediaSession' in navigator) {
          navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
        }
      }

      function updateModeButton() {
        const mode = MODES[state.modeIndex];
        ui.modeIcon.innerHTML = mode.icon;
        ui.modeButton.title = mode.label;
        ui.modeButton.setAttribute('aria-label', `${mode.label}；点击切换播放模式`);
      }

      function updateTrackNavigationButtons() {
        const disabled = !state.tracks.length;
        ui.previousButton.disabled = disabled;
        ui.nextButton.disabled = disabled;
      }

      function updateTrackNameMarquee() {
        const text = ui.trackNameText;
        const container = ui.trackName;
        if (!text || !container) return;
        container.classList.remove('is-overflowing');
        container.style.removeProperty('--marquee-distance');
        container.style.removeProperty('--marquee-duration');
        requestAnimationFrame(() => {
          const distance = Math.max(0, text.scrollWidth - container.clientWidth);
          if (distance <= 2) return;
          container.style.setProperty('--marquee-distance', `${Math.ceil(distance)}px`);
          container.style.setProperty('--marquee-duration', `${clamp(distance / 28 + 5, 7, 22).toFixed(1)}s`);
          container.classList.add('is-overflowing');
        });
      }

      function setTrackName(name = '') {
        ui.trackNameText.textContent = String(name || '');
        updateTrackNameMarquee();
      }

      function updateProgress() {
        const duration = ui.audio.duration;
        const current = ui.audio.currentTime;
        const percent = Number.isFinite(duration) && duration > 0 ? clamp((current / duration) * 100, 0, 100) : 0;
        ui.progressFill.style.width = `${percent}%`;
        ui.progressHandle.style.left = `${percent}%`;
        ui.progress.setAttribute('aria-valuenow', percent.toFixed(1));
        ui.currentTime.textContent = formatTime(current);
        ui.duration.textContent = formatTime(duration || activeTrack()?.duration || 0);
      }

      function renderPlaylist() {
        // 拖拽期间禁止替换列表 DOM，否则 pointer capture、目标位置和 data-index 会同时失效。
        if (state.playlistDragActive) {
          state.playlistRenderPending = true;
          return;
        }
        ui.clearButton.disabled = !state.tracks.length || state.reorderMode;
        ui.reorderButton.disabled = !state.tracks.length;
        ui.customSortButton.disabled = !state.tracks.length || state.reorderMode;
        const undoIds = state.customSortUndoIds;
        const currentIds = state.tracks.map(track => track.id);
        const canUndoCustomSort = Array.isArray(undoIds)
          && undoIds.length === currentIds.length
          && new Set(undoIds).size === undoIds.length
          && undoIds.every(id => currentIds.includes(id));
        ui.customSortUndoButton.disabled = !canUndoCustomSort;
        ui.reorderButton.classList.toggle('active', state.reorderMode);
        ui.reorderButton.textContent = state.reorderMode ? '完成排序' : '调整顺序';
        ui.reorderButton.setAttribute('aria-pressed', String(state.reorderMode));
        ui.reorderButton.title = state.reorderMode ? '保存当前顺序并退出' : '进入独立的单列拖拽排序模式';
        ui.audioList.classList.toggle('reorder-mode', state.reorderMode);
        ui.fileInput.disabled = state.reorderMode;
        ui.fileInput.closest('.import-button')?.classList.toggle('is-disabled', state.reorderMode);
        updateTrackNavigationButtons();
        ui.audioList.replaceChildren();
        if (!state.tracks.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-list';
          empty.innerHTML = state.restoring
            ? `${SVG.music}<div>正在恢复本地音频…</div>`
            : `${SVG.music}<div>暂无音频文件<br><small>导入后会自动保存在当前浏览器中</small></div>`;
          ui.audioList.appendChild(empty);
          return;
        }

        state.tracks.forEach((track, index) => {
          const item = document.createElement('div');
          item.className = `audio-item${index === state.currentIndex ? ' active' : ''}`;
          item.dataset.index = String(index);
          item.dataset.trackId = track.id;
          item.role = 'button';
          item.tabIndex = state.reorderMode ? -1 : 0;
          item.setAttribute('aria-label', `播放 ${track.name}`);

          const dragHandle = document.createElement('button');
          dragHandle.className = 'drag-handle';
          dragHandle.type = 'button';
          dragHandle.dataset.dragId = track.id;
          dragHandle.setAttribute('aria-label', `拖动 ${track.name} 到播放列表中的新位置`);
          dragHandle.disabled = !state.reorderMode;
          dragHandle.title = state.reorderMode
            ? '上下拖动改变位置；也可用方向键逐项移动'
            : '点击“调整顺序”后可拖动';
          dragHandle.innerHTML = '<span class="drag-dots" aria-hidden="true">•••</span>';

          const icon = document.createElement('div');
          icon.className = 'audio-icon';
          icon.innerHTML = SVG.music;

          const meta = document.createElement('div');
          meta.className = 'audio-meta';
          const name = document.createElement('div');
          name.className = 'audio-name';
          name.textContent = track.name;
          const duration = document.createElement('div');
          duration.className = 'audio-duration';
          duration.textContent = Number.isFinite(track.duration) && track.duration > 0 ? formatTime(track.duration) : '--:--';
          meta.append(name, duration);

          const remove = document.createElement('button');
          remove.className = 'delete-button';
          remove.type = 'button';
          remove.dataset.deleteIndex = String(index);
          remove.setAttribute('aria-label', `删除 ${track.name}`);
          remove.textContent = '×';

          item.append(dragHandle, icon, meta, remove);
          ui.audioList.appendChild(item);
        });
      }

      function updateMediaSession() {
        if (!('mediaSession' in navigator)) return;
        const track = activeTrack();
        if (!track) {
          navigator.mediaSession.metadata = null;
          return;
        }
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: track.name,
            artist: '英语听力播放器',
            album: '本地音频'
          });
        } catch (_) {}
      }

      function resetPlayerView() {
        state.currentIndex = -1;
        state.reorderMode = false;
        state.customSortUndoIds = [];
        state.pendingRestoreTime = null;
        state.pendingRestoreTrackId = '';
        state.pendingProgressSeekRatio = null;
        state.lastStoredPlaybackSecond = -1;
        storage.remove('english-focus-player-current-id');
        storage.remove('english-focus-player-current-time');
        state.sourceSerial += 1;
        state.playIntent = false;
        state.mimeRetrying = false;
        ui.audio.pause();
        ui.audio.removeAttribute('src');
        ui.audio.load();
        setTrackName('');
        ui.currentTime.textContent = '00:00';
        ui.duration.textContent = '00:00';
        ui.progressFill.style.width = '0%';
        ui.progressHandle.style.left = '0%';
        ui.progress.setAttribute('aria-valuenow', '0');
        updatePlayButton();
        updateMediaSession();
        renderPlaylist();
      }

      function loadTrack(index, autoplay = false, resumeTime = null) {
        if (!Number.isInteger(index) || index < 0 || index >= state.tracks.length) return;

        const track = state.tracks[index];
        state.currentIndex = index;
        state.pendingRestoreTime = Number.isFinite(Number(resumeTime)) ? Math.max(0, Number(resumeTime)) : null;
        state.pendingRestoreTrackId = state.pendingRestoreTime !== null ? track.id : '';
        state.pendingProgressSeekRatio = null;
        state.lastStoredPlaybackSecond = -1;
        storage.set('english-focus-player-current-id', track.id);
        storage.set('english-focus-player-current-time', state.pendingRestoreTime !== null ? state.pendingRestoreTime : 0);
        state.sourceSerial += 1;
        state.lastErrorKey = '';
        state.playIntent = Boolean(autoplay);
        state.mimeRetrying = false;
        ensureTrackMimeState(track);

        ui.audio.pause();
        ui.audio.removeAttribute('src');
        ui.audio.load();
        ui.audio.src = track.url;
        ui.audio.preload = 'auto';
        setNativeOutputDefaults();

        setTrackName(track.name);
        ui.currentTime.textContent = '00:00';
        ui.duration.textContent = track.duration > 0 ? formatTime(track.duration) : '00:00';
        ui.progressFill.style.width = '0%';
        ui.progressHandle.style.left = '0%';
        ui.progress.setAttribute('aria-valuenow', '0');

        renderPlaylist();
        updateMediaSession();
        updatePlayButton();

        if (autoplay) startPlayback();
      }

      function tryNextMimeSource(expectedSourceSerial = state.sourceSerial) {
        const track = activeTrack();
        if (!track || state.mimeRetrying || expectedSourceSerial !== state.sourceSerial) return false;
        const candidates = ensureTrackMimeState(track);
        const nextIndex = (Number(track.mimeIndex) || 0) + 1;
        if (nextIndex >= candidates.length) return false;

        state.mimeRetrying = true;
        const shouldResume = state.playIntent;
        const resumeTime = Number(ui.audio.currentTime);
        if (Number.isFinite(resumeTime) && resumeTime > 0) {
          state.pendingRestoreTime = resumeTime;
          state.pendingRestoreTrackId = track.id;
        }

        if (!applyTrackMimeCandidate(track, nextIndex)) {
          state.mimeRetrying = false;
          return false;
        }

        state.sourceSerial += 1;
        state.lastErrorKey = '';
        ui.audio.pause();
        ui.audio.removeAttribute('src');
        ui.audio.load();
        ui.audio.src = track.url;
        ui.audio.preload = 'auto';
        setNativeOutputDefaults();
        state.mimeRetrying = false;

        if (shouldResume) setTimeout(() => startPlayback({ userInitiated: true }), 0);
        return true;
      }

      function describePlaybackError(error) {
        if (error?.name === 'NotAllowedError') {
          return '浏览器未允许本次播放，请直接点击中央播放按钮重试。';
        }
        if (error?.name === 'NotSupportedError') {
          return '当前浏览器无法解码这个音频格式，请换用 MP3、WAV、M4A、AAC、FLAC、OGG 或 OPUS。';
        }
        const mediaError = ui.audio.error;
        if (mediaError) {
          const messages = {
            1: '音频加载被中止。',
            2: '读取音频文件时发生错误。',
            3: '音频文件无法解码，文件可能损坏或编码不受支持。',
            4: '当前浏览器不支持这个音频格式。'
          };
          return messages[mediaError.code] || '音频播放失败。';
        }
        return error?.message ? `音频播放失败：${error.message}` : '音频播放失败，请检查文件是否完整。';
      }

      function reportPlaybackError(error) {
        updatePlayButton();
        const message = describePlaybackError(error);
        const key = `${activeTrack()?.name || ''}|${message}`;
        if (key === state.lastErrorKey) return;
        state.lastErrorKey = key;
        console.error(message, error || ui.audio.error);
        alert(message);
      }

      function startPlayback({ userInitiated = false } = {}) {
        if (state.currentIndex < 0) {
          if (!state.tracks.length) return;
          loadTrack(0, false);
        }

        const track = activeTrack();
        if (!ui.audio.getAttribute('src') && track?.url) {
          ui.audio.src = track.url;
          ui.audio.preload = 'auto';
        }

        setNativeOutputDefaults();
        state.lastErrorKey = '';
        state.playIntent = true;
        const requestSerial = ++state.playRequestSerial;
        const sourceSerial = state.sourceSerial;

        let result;
        try {
          // 中央按钮的 click 事件会同步进入这里，保留浏览器认可的用户手势。
          result = ui.audio.play();
        } catch (error) {
          setTimeout(() => {
            if (requestSerial !== state.playRequestSerial || sourceSerial !== state.sourceSerial) return;
            if (!tryNextMimeSource(sourceSerial)) reportPlaybackError(error);
          }, 0);
          return;
        }

        if (result && typeof result.then === 'function') {
          result.then(() => {
            if (requestSerial === state.playRequestSerial) state.lastErrorKey = '';
          }).catch(error => {
            // 忽略已经被新一次播放操作取代的旧 Promise，避免延迟弹出错误提示。
            setTimeout(() => {
              if (requestSerial !== state.playRequestSerial || sourceSerial !== state.sourceSerial) return;
              if (!ui.audio.paused && !ui.audio.ended) return;
              if (!tryNextMimeSource(sourceSerial)) reportPlaybackError(error);
            }, 0);
          });
        }
      }

      function togglePlayback() {
        if (!ui.audio.paused && !ui.audio.ended) {
          state.playRequestSerial += 1;
          state.playIntent = false;
          ui.audio.pause();
        } else {
          startPlayback({ userInitiated: true });
        }
      }

      function seekTo(seconds) {
        const duration = ui.audio.duration;
        if (!Number.isFinite(duration) || duration <= 0) return false;
        ui.audio.currentTime = clamp(Number(seconds) || 0, 0, duration);
        updateProgress();
        return true;
      }

      function seekBy(delta) {
        if (state.currentIndex < 0) return;
        const shouldResumePlayback = ui.audio.paused || ui.audio.ended;
        const didSeek = seekTo(ui.audio.currentTime + Number(delta || 0));
        if (didSeek && shouldResumePlayback) startPlayback();
      }

      function seekFromPointer(clientX) {
        const rect = ui.progress.getBoundingClientRect();
        if (!rect.width) return false;

        const ratio = clamp((clientX - rect.left) / rect.width, 0, 1);
        const track = activeTrack();
        const nativeDuration = Number(ui.audio.duration);
        const storedDuration = Number(track?.duration);
        const metadataReady = Number.isFinite(nativeDuration) && nativeDuration > 0;
        const usableDuration = metadataReady
          ? nativeDuration
          : (Number.isFinite(storedDuration) && storedDuration > 0 ? storedDuration : 0);

        // 用户主动拖动的目标位置优先于刷新时保存的旧播放位置。
        state.pendingRestoreTime = null;
        state.pendingRestoreTrackId = '';

        if (metadataReady) {
          state.pendingProgressSeekRatio = null;
          seekTo(nativeDuration * ratio);
          return true;
        }

        // 刷新后元数据可能尚未就绪：先记住比例，等 loadedmetadata 后精确定位。
        state.pendingProgressSeekRatio = ratio;
        const percent = ratio * 100;
        ui.progressFill.style.width = `${percent}%`;
        ui.progressHandle.style.left = `${percent}%`;
        ui.progress.setAttribute('aria-valuenow', percent.toFixed(1));

        if (usableDuration > 0) {
          const target = usableDuration * ratio;
          ui.currentTime.textContent = formatTime(target);
          ui.duration.textContent = formatTime(usableDuration);
        }
        return true;
      }

      function persistTrackOrder() {
        const revision = ++orderPersistRevision;
        const snapshot = state.tracks.map((track, index) => {
          track.order = (index + 1) * 1000;
          return { id: track.id, order: track.order };
        });

        orderPersistQueue = orderPersistQueue
          .catch(() => {})
          .then(async () => {
            if (revision !== orderPersistRevision) return;
            try {
              await audioStore.updateOrders(snapshot);
            } catch (error) {
              notifyPersistenceIssue(error, '保存播放顺序');
            }
          });
        return orderPersistQueue;
      }

      function applyExactTrackOrder(nextIds, { render = true, persist = true, preserveCustomSortUndo = false } = {}) {
        if (!Array.isArray(nextIds) || nextIds.length !== state.tracks.length) return false;
        const trackById = new Map(state.tracks.map(track => [track.id, track]));
        if (trackById.size !== state.tracks.length) return false;
        if (nextIds.some(id => !trackById.has(id)) || new Set(nextIds).size !== nextIds.length) return false;

        const oldIds = state.tracks.map(track => track.id);
        if (oldIds.every((id, index) => id === nextIds[index])) return false;

        const currentTrackId = activeTrack()?.id || '';
        if (!preserveCustomSortUndo) state.customSortUndoIds = [];
        state.tracks = nextIds.map(id => trackById.get(id));
        state.currentIndex = currentTrackId
          ? state.tracks.findIndex(track => track.id === currentTrackId)
          : -1;
        if (render) renderPlaylist();
        if (persist) void persistTrackOrder();
        return true;
      }

      function moveTrack(fromIndex, toIndex) {
        if (!Number.isInteger(fromIndex) || !Number.isInteger(toIndex)) return false;
        if (fromIndex < 0 || fromIndex >= state.tracks.length || toIndex < 0 || toIndex >= state.tracks.length) return false;
        if (fromIndex === toIndex) return false;
        const nextIds = state.tracks.map(track => track.id);
        const [sourceId] = nextIds.splice(fromIndex, 1);
        nextIds.splice(toIndex, 0, sourceId);
        return applyExactTrackOrder(nextIds);
      }

      // gapIndex 基于“移除源文件后的列表间隙”：0 为最前，length 为最后。
      // 只从拖拽开始时的稳定快照生成下一顺序，因此未拖动文件的相对顺序不可能改变。
      function moveTrackToGap(sourceId, gapIndex, baseOrderIds) {
        if (!sourceId || !Number.isInteger(gapIndex) || !Array.isArray(baseOrderIds)) return false;
        const currentIds = state.tracks.map(track => track.id);
        const currentSet = new Set(currentIds);
        if (!currentSet.has(sourceId)) return false;

        const stableIds = [];
        const seen = new Set();
        for (const id of baseOrderIds) {
          if (currentSet.has(id) && !seen.has(id)) {
            seen.add(id);
            stableIds.push(id);
          }
        }
        // 理论上排序模式中不会导入新文件；即使外部异步加入，也只追加到末尾且保持其相对顺序。
        for (const id of currentIds) {
          if (!seen.has(id)) {
            seen.add(id);
            stableIds.push(id);
          }
        }

        const nextIds = stableIds.filter(id => id !== sourceId);
        nextIds.splice(clamp(gapIndex, 0, nextIds.length), 0, sourceId);
        return applyExactTrackOrder(nextIds, { render: false, persist: false });
      }

      // 文件名排序只改变底层比较键，不修改页面显示的原文件名。
      // 明确使用中文拼音校对规则；数字按数值比较，标点不参与主排序。
      const customSortCollator = new Intl.Collator(['zh-CN-u-co-pinyin', 'zh-CN'], {
        usage: 'sort',
        numeric: true,
        sensitivity: 'base',
        ignorePunctuation: true
      });

      const CHINESE_NUMERAL_DIGITS = Object.freeze({
        '零': 0, '〇': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4,
        '五': 5, '六': 6, '七': 7, '八': 8, '九': 9
      });
      const CHINESE_NUMERAL_UNITS = Object.freeze({
        '十': 10, '百': 100, '千': 1000, '万': 10000, '亿': 100000000
      });
      const CHINESE_NUMERAL_CHARS = '零〇一二两三四五六七八九十百千万亿';
      const CHINESE_NUMERAL_SUFFIXES = '课|章|节|集|讲|期|卷|册|篇|回|季|部|单元|部分|组|套|段|级|次';

      function chineseNumeralToNumber(text) {
        const source = String(text || '');
        if (!source || [...source].some(char => !(char in CHINESE_NUMERAL_DIGITS) && !(char in CHINESE_NUMERAL_UNITS))) {
          return null;
        }

        // “二〇二四”一类逐字数字不包含单位，直接按十进制数字串处理。
        if (!/[十百千万亿]/.test(source)) {
          const digits = [...source].map(char => CHINESE_NUMERAL_DIGITS[char]);
          const value = Number(digits.join(''));
          return Number.isSafeInteger(value) ? value : null;
        }

        let total = 0;
        let section = 0;
        let digit = 0;
        for (const char of source) {
          if (char in CHINESE_NUMERAL_DIGITS) {
            digit = CHINESE_NUMERAL_DIGITS[char];
            continue;
          }

          const unit = CHINESE_NUMERAL_UNITS[char];
          if (unit < 10000) {
            section += (digit || 1) * unit;
          } else {
            section += digit;
            if (!section) section = 1;
            total += section * unit;
            section = 0;
          }
          digit = 0;
        }

        const value = total + section + digit;
        return Number.isSafeInteger(value) ? value : null;
      }

      function replaceChineseNumericToken(match, prefix = '', numeral = '', suffix = '') {
        const value = chineseNumeralToNumber(numeral);
        return value === null ? match : `${prefix}${value}${suffix}`;
      }

      function normalizeChineseNumeralsForSort(value) {
        let normalized = String(value || '');
        const chars = CHINESE_NUMERAL_CHARS;
        const suffixes = CHINESE_NUMERAL_SUFFIXES;

        // 第十二课、第二章以及以“第十二”结尾的常见序号。
        normalized = normalized.replace(
          new RegExp(String.raw`第([${chars}]+)(?=(?:${suffixes})|$|[\s._-])`, 'g'),
          (match, numeral) => replaceChineseNumericToken(match, '第', numeral, '')
        );

        // 十二课、二十章等带量词的数字。
        normalized = normalized.replace(
          new RegExp(String.raw`([${chars}]+)(?=(?:${suffixes}))`, 'g'),
          (match, numeral) => replaceChineseNumericToken(match, '', numeral, '')
        );

        // （二）、[十]、【十二】等常见编号。
        normalized = normalized.replace(
          new RegExp(String.raw`([（(\[【])([${chars}]+)([）)\]】])`, 'g'),
          (match, opening, numeral, closing) => replaceChineseNumericToken(match, opening, numeral, closing)
        );

        // 文件名开头的“一、”“二-”“三_”等编号。
        normalized = normalized.replace(
          new RegExp(String.raw`^([${chars}]+)(?=[、.．:_-])`, 'g'),
          (match, numeral) => replaceChineseNumericToken(match, '', numeral, '')
        );

        return normalized;
      }

      function filenameSortKey(track) {
        const visibleName = String(track?.name || cleanName(track?.fileName || '') || '');
        let key = visibleName;
        try { key = key.normalize('NFKC'); } catch (_) {}
        key = key
          .replace(/[\u200B-\u200D\u2060\uFEFF]/g, '')
          .replace(/[‐‑‒–—―﹘﹣－]/g, '-')
          .replace(/[\s\u00A0\u2000-\u200A\u202F\u205F\u3000]+/g, ' ')
          .trim();
        return normalizeChineseNumeralsForSort(key);
      }

      function compareCustomSortField(a, b, field, direction) {
        const descending = direction === 'desc';
        let result = 0;

        if (field === 'name') {
          const aKey = filenameSortKey(a);
          const bKey = filenameSortKey(b);
          // 空名称始终放在末尾，不受升降序影响。
          if (Boolean(aKey) !== Boolean(bKey)) return aKey ? -1 : 1;
          result = customSortCollator.compare(aKey, bKey);
        } else if (field === 'extension') {
          result = customSortCollator.compare(fileExtension(a.fileName || ''), fileExtension(b.fileName || ''));
        } else if (field === 'duration') {
          const aValue = Number(a.duration);
          const bValue = Number(b.duration);
          const aValid = Number.isFinite(aValue) && aValue > 0;
          const bValid = Number.isFinite(bValue) && bValue > 0;
          // 尚未读取到时长的文件始终排在末尾，不因升降序跑到最前。
          if (aValid !== bValid) return aValid ? -1 : 1;
